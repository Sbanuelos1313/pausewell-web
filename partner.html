ko:{hot_flashes:['안면홍조를 겪고 있을 수 있습니다','공간을 시원하게 유지하고 선풍기, 차가운 음료 또는 시원한 수건을 준비해 주세요.'],sleep_disruption:['수면이 방해받고 있을 수 있습니다','힘든 밤을 보낸 뒤에는 더 인내심을 갖고 휴식 시간을 지킬 수 있도록 도와주세요.'],mood_swings:['기분이 변동하고 있을 수 있습니다','압박하지 말고 곁에 있어 주세요. 모든 것을 해결하려 하기보다 무엇이 필요한지 물어보세요.'],brain_fog:['인지적 명료함이 영향을 받을 수 있습니다','깜빡하는 일에 인내심을 갖고 필요할 때 알림이나 목록을 도와주세요.'],fatigue:['에너지 수준이 낮을 수 있습니다','가능할 때 추가 일을 맡고 휴식 시간을 지켜 주세요.'],anxiety:['불안이 높아질 수 있습니다','차분한 환경을 만들고 불필요한 놀라움을 피하며 부드럽게 안부를 물어보세요.'],joint_pain:['신체적 불편감이 있을 수 있습니다','신체 활동이 필요한 일을 도와주고 편안함에 대한 필요가 달라질 수 있음을 배려해 주세요.']},

const params=new URLSearchParams(location.search);let lang=params.get('lang')||'en';if(!LANGS.includes(lang))lang='en';
const sel=document.getElementById('lang');LANGS.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=NAMES[x];sel.appendChild(o)});sel.value=lang;
function applyLanguage(){const x=L[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.getElementById('loading-text').textContent=x.loading;document.getElementById('error-title').textContent=x.errorTitle;document.getElementById('error-body').textContent=x.errorBody;document.getElementById('supporting').textContent=x.supporting;document.getElementById('symptoms-title').textContent=x.symptoms;document.getElementById('support-title').textContent=x.supportTitle;document.getElementById('support-sub').textContent=x.supportSub;document.getElementById('journey-title').textContent=x.journey;document.getElementById('helps-title').textContent=x.helps;document.getElementById('powered').textContent=x.powered;document.getElementById('auto-update').textContent=x.auto}
sel.addEventListener('change',()=>{params.set('lang',sel.value);location.search=params.toString()});applyLanguage();
function getSeverityColor(s){if(s<=3)return'#79a783';if(s<=6)return'#c6a15b';return'#a96972'}
function showError(){document.getElementById('loading').style.display='none';document.getElementById('error').style.display='block'}
async function load(){
const token=params.get('token');if(!token){showError();return}
try{
const tokenRes=await fetch(`${SUPABASE_URL}/rest/v1/pw_partner_tokens?token=eq.${token}&select=*`,{headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${SUPABASE_ANON_KEY}`}});
const tokens=await tokenRes.json();if(!tokens.length){showError();return}
const{user_id,partner_name}=tokens[0];
const profileRes=await fetch(`${SUPABASE_URL}/rest/v1/pw_user_profiles?id=eq.${user_id}&select=full_name,menopause_stage`,{headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${SUPABASE_ANON_KEY}`}});
const profiles=await profileRes.json();const profile=profiles[0];
const since=new Date(Date.now()-7*24*60*60*1000).toISOString();
const symptomsRes=await fetch(`${SUPABASE_URL}/rest/v1/pw_symptom_logs?user_id=eq.${user_id}&logged_at=gte.${since}&select=symptom_id,severity,logged_at`,{headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${SUPABASE_ANON_KEY}`}});
const symptoms=await symptomsRes.json();
document.getElementById('loading').style.display='none';document.getElementById('app').style.display='block';
const firstName=profile?.full_name?.split(' ')[0]||L[lang].partner;document.getElementById('partner-name').textContent=firstName;
const st=(STAGES[lang]&&STAGES[lang][profile?.menopause_stage])||STAGES[lang].peri_early;document.getElementById('partner-stage').textContent=st[0];document.getElementById('stage-explainer').innerHTML=`<p style="font-size:15px;line-height:1.65">${st[1]}</p>`;
const counts={},severities={};symptoms.forEach(x=>{counts[x.symptom_id]=(counts[x.symptom_id]||0)+1;(severities[x.symptom_id]??=[]).push(x.severity)});
const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5);
document.getElementById('symptoms-list').innerHTML=top.length?top.map(([id])=>{const avg=severities[id].reduce((a,b)=>a+b,0)/severities[id].length;return`<div class="symptom-row"><div class="symptom-name">${SYM[lang][id]||id.replaceAll('_',' ')}</div><div class="severity-bar-wrap"><div class="severity-bar" style="width:${avg*10}%;background:${getSeverityColor(avg)}"></div></div><div class="severity-num">${avg.toFixed(1)}</div></div>`}).join(''):`<p>${L[lang].none}</p>`;
const tips=top.slice(0,3).map(([id])=>TIP[lang][id]).filter(Boolean);document.getElementById('tips-list').innerHTML=tips.length?tips.map(t=>`<div class="tip-row"><div class="tip-text"><div class="tip-title">${t[0]}</div>${t[1]}</div></div>`).join(''):`<p>${L[lang].more}</p>`;
document.getElementById('helps-list').innerHTML=HELP[lang].map(t=>`<div class="tip-row"><div class="tip-text"><div class="tip-title">${t[0]}</div>${t[1]}</div></div>`).join('');
const locale={en:'en-US',es:'es',fr:'fr',pt:'pt-BR',de:'de-DE',ja:'ja-JP',ko:'ko-KR',ar:'ar'}[lang];document.getElementById('last-updated').textContent=`${L[lang].updated} ${new Intl.DateTimeFormat(locale,{month:'long',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date())}`;
}catch(e){console.error(e);showError()}}
load();
</script>
