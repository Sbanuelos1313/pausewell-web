const DATA={"en":{"title":"Privacy Policy — PauseWell","h1":"PauseWell Privacy Policy","tag":"Your health data belongs to you — always.","updated":"","intro":"PauseWell is built on a simple promise: your personal health data is yours. We never sell it, never share it with advertisers, and never use it for any purpose other than providing you with the best possible wellness experience.","body":"<section><h2>1. Who We Are</h2>\n<p>PauseWell is a product of SamInterest LLC d/b/a Chronos AI (“we,” “us,” or “our”), based in Edmond, Oklahoma, United States. We can be reached at <a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>.</p>\n</section>\n<section><h2>2. Information We Collect</h2>\n<h3><strong>Information you provide directly</strong></h3>\n<div class='li'><strong>Account information:</strong> Your name, email address, and password when you create an account</div>\n<div class='li'><strong>Health profile:</strong> Your menopause stage and stage transitions over time</div>\n<div class='li'><strong>Symptom logs:</strong> Symptoms you log including type, severity, timing, context, and any notes you add</div>\n<div class='li'><strong>Voice entries:</strong> Audio recordings you make for voice logging (processed immediately and not stored as audio — only the resulting text transcript is saved)</div>\n<div class='li'><strong>Journal entries:</strong> Your private journal content including mood, energy, reflections, and gratitude entries</div>\n<div class='li'><strong>Cycle data:</strong> Menstrual cycle information you choose to log</div>\n<div class='li'><strong>Notification preferences:</strong> Your communication preferences</div>\n<h3><strong>Information from Apple Health (with your explicit permission)</strong></h3>\n<div class='li'>Sleep analysis data</div>\n<div class='li'>Heart rate measurements</div>\n<div class='li'>Heart rate variability (HRV)</div>\n<div class='li'>Step count</div>\n<p>Apple Health data is read-only. We never write data back to Apple Health. You can revoke this permission at any time in Settings → Privacy & Security → Health → PauseWell.</p>\n<h3><strong>Information collected automatically</strong></h3>\n<div class='li'>App usage analytics (screens viewed, features used) — used only to improve the app</div>\n<div class='li'>Device type and operating system version for technical support</div>\n<div class='li'>Crash reports to help us fix bugs</div>\n</section>\n<section><h2>3. How We Use Your Information</h2>\n<div class='li'>To provide and personalize your PauseWell wellness experience</div>\n<div class='li'>To generate your personalized daily wellness protocols</div>\n<div class='li'>To identify symptom patterns and surface insights from your data</div>\n<div class='li'>To generate doctor reports at your request</div>\n<div class='li'>To send you daily check-in reminders (only if you enable them)</div>\n<div class='li'>To improve PauseWell’s features and accuracy</div>\n<div class='li'>To provide customer support</div>\n<div class='li'>To comply with legal obligations</div>\n<h3><strong>We do NOT use your health data to train AI models that are shared externally, sell your data to third parties, share your data with insurers or employers, or serve you advertisements based on your health information.</strong></h3>\n</section>\n<section><h2>4. How We Share Your Information</h2>\n<p>We share your information only in these limited circumstances:</p>\n<div class='li'><strong>Service providers:</strong> We use Supabase (database), Deepgram (voice transcription), and Anthropic (AI protocol generation). These providers are contractually bound to protect your data and may not use it for their own purposes.</div>\n<div class='li'><strong>At your direction:</strong> When you choose to generate and share a doctor report, you control who receives that information.</div>\n<div class='li'><strong>Legal requirements:</strong> If required by law, court order, or governmental authority.</div>\n<div class='li'><strong>Business transfers:</strong> In the event of a merger or acquisition, your data protections transfer with the business.</div>\n<h3><strong>We never sell your personal health information. Ever.</strong></h3>\n</section>\n<section><h2>5. Data Storage and Security</h2>\n<p>Your data is stored on encrypted servers provided by Supabase (hosted on AWS). We use industry-standard encryption in transit (TLS) and at rest. Access to your data is restricted to authorized personnel only.</p>\n<p>Voice recordings are processed in real-time by Deepgram’s API and are not stored by PauseWell. Only the resulting text transcript is saved to your account.</p>\n</section>\n<section><h2>6. Your Rights and Choices</h2>\n<div class='li'><strong>Access:</strong> You can view all your data within the app at any time</div>\n<div class='li'><strong>Export:</strong> Generate a doctor report to export your symptom data in PDF format</div>\n<div class='li'><strong>Correction:</strong> Edit or delete individual symptom logs and journal entries</div>\n<div class='li'><strong>Deletion:</strong> Delete your entire account and all associated data from Settings → You → Profile → Delete my account & data</div>\n<div class='li'><strong>Notifications:</strong> Opt out of push notifications at any time in Settings → You → Profile → Notifications</div>\n<div class='li'><strong>Apple Health:</strong> Revoke Apple Health permissions at any time in iOS Settings</div>\n</section>\n<section><h2>7. Data Retention</h2>\n<p>We retain your data for as long as your account is active. When you delete your account, all your personal data is permanently deleted within 30 days. Anonymized, aggregated data (with no personal identifiers) may be retained for research purposes.</p>\n</section>\n<section><h2>8. Children’s Privacy</h2>\n<p>PauseWell is designed for adults experiencing perimenopause and menopause. We do not knowingly collect information from anyone under the age of 18. If we become aware that a child under 18 has provided personal information, we will delete it immediately.</p>\n</section>\n<section><h2>9. California Privacy Rights (CCPA)</h2>\n<p>California residents have the right to know what personal information we collect, request deletion of your personal information, opt out of the sale of personal information (we do not sell personal information), and not be discriminated against for exercising these rights. To exercise these rights, contact us at <a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>.</p>\n</section>\n<section><h2>10. International Users</h2>\n<p>PauseWell is operated from the United States. If you access PauseWell from outside the US, your information may be transferred to and processed in the United States. By using PauseWell, you consent to this transfer.</p>\n</section>\n<section><h2>11. Changes to This Policy</h2>\n<p>We may update this Privacy Policy from time to time. We will notify you of significant changes via email or in-app notification. Continued use of PauseWell after changes constitutes acceptance of the updated policy.</p>\n</section>\n<section><h2>12. Health Information Disclaimer</h2>\n<p>PauseWell is a wellness tracking tool and does not provide medical diagnoses, treatment recommendations, or medical advice. The information in PauseWell is for informational and wellness purposes only. Always consult a qualified healthcare provider for medical advice.</p>\n</section>\n<section><h2>13. European Union — GDPR</h2>\n<p>If you are located in the European Economic Area (EEA), United Kingdom, or Switzerland, the following additional rights apply to you under the General Data Protection Regulation (GDPR) and equivalent laws:</p>\n<h3><strong>Legal basis for processing</strong></h3>\n<div class='li'><strong>Contract performance:</strong> Processing necessary to provide PauseWell services to you</div>\n<div class='li'><strong>Legitimate interests:</strong> Improving our services, ensuring security, and preventing fraud</div>\n<div class='li'><strong>Consent:</strong> Processing your health data and Apple Health data, which you may withdraw at any time</div>\n<div class='li'><strong>Legal obligation:</strong> Compliance with applicable laws</div>\n<h3><strong>Your GDPR rights</strong></h3>\n<div class='li'><strong>Right of access:</strong> Request a copy of all personal data we hold about you</div>\n<div class='li'><strong>Right to rectification:</strong> Correct inaccurate or incomplete data</div>\n<div class='li'><strong>Right to erasure (“right to be forgotten”):</strong> Request deletion of your personal data</div>\n<div class='li'><strong>Right to restrict processing:</strong> Request that we limit how we use your data</div>\n<div class='li'><strong>Right to data portability:</strong> Receive your data in a structured, machine-readable format</div>\n<div class='li'><strong>Right to object:</strong> Object to processing based on legitimate interests</div>\n<div class='li'><strong>Right to withdraw consent:</strong> Withdraw consent at any time without affecting prior processing</div>\n<p>To exercise any of these rights, contact us at <a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>. We will respond within 30 days. You also have the right to lodge a complaint with your local data protection authority.</p>\n<p><strong>Data transfers:</strong> Your data is stored in the United States. When transferring data from the EEA, we rely on Standard Contractual Clauses (SCCs) approved by the European Commission to ensure adequate protection.</p>\n</section>\n<section><h2>14. Canada — PIPEDA</h2>\n<p>If you are located in Canada, your personal information is governed by the Personal Information Protection and Electronic Documents Act (PIPEDA) and applicable provincial privacy laws.</p>\n<div class='li'>We collect, use, and disclose your personal information only with your knowledge and consent</div>\n<div class='li'>We collect only the information necessary for the purposes identified in this policy</div>\n<div class='li'>You have the right to access your personal information and challenge its accuracy</div>\n<div class='li'>You may withdraw consent at any time, subject to legal or contractual restrictions</div>\n<div class='li'>Our Privacy Officer can be reached at privacy@chronosai.com</div>\n</section>\n<section><h2>15. Australia — Privacy Act</h2>\n<p>If you are located in Australia, we comply with the Australian Privacy Act 1988 and the Australian Privacy Principles (APPs).</p>\n<div class='li'>You have the right to access personal information we hold about you</div>\n<div class='li'>You have the right to request correction of inaccurate personal information</div>\n<div class='li'>You may complain about a breach of the APPs to us first; if unresolved, to the Office of the Australian Information Commissioner (OAIC)</div>\n<div class='li'>Health information is treated as sensitive information under Australian law and receives heightened protection</div>\n</section>\n<section><h2>16. Indigenous Data Sovereignty</h2>\n<p>PauseWell is committed to the principles of Indigenous Data Sovereignty. For users who are members of Indigenous communities, including Cherokee, Muscogee, and other Nations:</p>\n<div class='li'>Your personal health data belongs to you and your community — not to PauseWell</div>\n<div class='li'>We support your right to govern how data about you is collected, used, and shared</div>\n<div class='li'>We do not share, aggregate, or use Indigenous users’ health data for research without explicit tribal or community consent</div>\n<div class='li'>We respect the CARE Principles for Indigenous Data Governance: Collective Benefit, Authority to Control, Responsibility, and Ethics</div>\n<div class='li'>Tribal nations and Indigenous communities may contact us to discuss data governance agreements at tribal@chronosai.com</div>\n</section>\n<section><h2>Contact Us</h2>\n<p>If you have questions about this Privacy Policy or your data, please contact us:</p>\n<p><a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a></p>\n</section>","notice":"English is the authoritative legal text."},"es":{"title":"Política de privacidad — PauseWell","h1":"Política de privacidad de PauseWell","tag":"Tus datos de salud te pertenecen — siempre.","updated":"","intro":"PauseWell se basa en una promesa sencilla: tus datos personales de salud son tuyos. Nunca los vendemos, nunca los compartimos con anunciantes y nunca los utilizamos para ningún fin distinto de ofrecerte la mejor experiencia de bienestar posible.","body":"<section><h2>1. Quiénes somos</h2><p>PauseWell es un producto de SamInterest LLC d/b/a Chronos AI (“nosotros”), con sede en Edmond, Oklahoma, Estados Unidos. Puedes contactarnos en <a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>.</p></section><section><h2>2. Qué información recopilamos</h2><p>Información que proporcionas directamente: información de cuenta (nombre, correo electrónico y contraseña); perfil de salud (etapa de menopausia y transiciones); registros de síntomas (tipo, gravedad, momento, contexto y notas); entradas de voz (el audio se procesa inmediatamente y no se almacena; solo se guarda la transcripción); diario privado (estado de ánimo, energía, reflexiones y gratitud); datos del ciclo menstrual; y preferencias de notificaciones. Apple Health, solo con tu permiso explícito: análisis del sueño, frecuencia cardíaca, variabilidad de la frecuencia cardíaca (HRV) y recuento de pasos. Los datos de Apple Health son de solo lectura; nunca escribimos datos en Apple Health. Puedes revocar el permiso en Configuración → Privacidad y seguridad → Salud → PauseWell. Información recopilada automáticamente: analíticas de uso de la aplicación (pantallas y funciones utilizadas) únicamente para mejorarla, tipo de dispositivo y versión del sistema operativo para soporte técnico, e informes de fallos para corregir errores.</p></section><section><h2>3. Cómo utilizamos tu información</h2><p>Utilizamos tu información para personalizar tu experiencia de bienestar; generar protocolos diarios personalizados; identificar patrones y tendencias en tus síntomas; crear informes para compartir con tu médico; enviar recordatorios y notificaciones si los activas; mejorar las funciones y la precisión de PauseWell; proporcionar soporte al cliente; y cumplir obligaciones legales. Nunca utilizamos tus datos de salud para entrenar modelos externos de IA, vendemos tus datos a terceros, los compartimos con aseguradoras o empleadores, ni mostramos publicidad basada en tus datos de salud.</p></section><section><h2>4. Cómo compartimos tu información</h2><p>Compartimos datos solo de forma limitada: con proveedores necesarios para operar PauseWell — Supabase para infraestructura de base de datos, Deepgram para procesamiento de voz y Anthropic para funciones de IA/protocolos — sujetos a obligaciones contractuales de protección de datos; cuando tú lo indicas, por ejemplo al generar o compartir un informe médico; cuando lo exige la ley; o en una transferencia empresarial. Nunca vendemos tu información personal de salud.</p></section><section><h2>5. Almacenamiento y seguridad de los datos</h2><p>Tus datos se almacenan en servidores cifrados proporcionados por Supabase y alojados en AWS. Utilizamos cifrado estándar del sector en tránsito (TLS) y en reposo, y el acceso está restringido al personal autorizado. Las grabaciones de voz son procesadas en tiempo real por la API de Deepgram y PauseWell no las almacena; solo se guarda la transcripción de texto resultante.</p></section><section><h2>6. Tus derechos y opciones</h2><p>Puedes acceder a tus datos en la aplicación; exportar tus datos de síntomas mediante un informe médico en PDF; corregir o eliminar registros individuales de síntomas y entradas del diario; eliminar toda tu cuenta y los datos asociados desde Configuración → Tú → Perfil → Eliminar mi cuenta y mis datos; desactivar las notificaciones push desde Configuración → Tú → Perfil → Notificaciones; y revocar los permisos de Apple Health en los ajustes de iOS.</p></section><section><h2>7. Conservación de datos</h2><p>Conservamos tus datos mientras tu cuenta esté activa. Cuando eliminas tu cuenta, tus datos personales se eliminan permanentemente en un plazo de 30 días. Podemos conservar datos anonimizados y agregados, sin identificadores personales, con fines de investigación.</p></section><section><h2>8. Privacidad de menores</h2><p>PauseWell está diseñado para adultos que atraviesan la perimenopausia y la menopausia. No recopilamos deliberadamente información de menores de 18 años. Si descubrimos que un menor de 18 años proporcionó información personal, la eliminaremos inmediatamente.</p></section><section><h2>9. Derechos de privacidad de California (CCPA)</h2><p>Los residentes de California tienen derecho a saber qué información personal recopilamos, solicitar su eliminación, optar por no participar en la venta de información personal (no vendemos información personal) y no sufrir discriminación por ejercer estos derechos. Para ejercerlos, escribe a <a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>.</p></section><section><h2>10. Usuarios internacionales</h2><p>PauseWell opera desde Estados Unidos. Si accedes desde fuera de EE. UU., tu información puede transferirse y procesarse en Estados Unidos. Al utilizar PauseWell, aceptas esta transferencia.</p></section><section><h2>11. Cambios en esta política</h2><p>Podemos actualizar esta Política de privacidad periódicamente. Te notificaremos los cambios significativos por correo electrónico o mediante una notificación en la aplicación. El uso continuado de PauseWell después de los cambios constituye la aceptación de la política actualizada.</p></section><section><h2>12. Aviso sobre información de salud</h2><p>PauseWell es una herramienta de bienestar, no un proveedor médico. No proporciona diagnósticos, recomendaciones de tratamiento ni asesoramiento médico. La información y los conocimientos de la aplicación tienen fines informativos y de bienestar. Consulta a un profesional sanitario cualificado sobre tus necesidades y decisiones de salud.</p></section><section><h2>13. Unión Europea — GDPR</h2><p>Si te encuentras en el EEE, Reino Unido o Suiza, tratamos tus datos conforme al GDPR aplicable. Las bases jurídicas incluyen la ejecución del contrato, intereses legítimos, tu consentimiento para datos de salud/Apple Health — que puedes retirar — y obligaciones legales. Tus derechos incluyen acceso, rectificación, supresión (“derecho al olvido”), limitación, portabilidad, oposición y retirada del consentimiento. Escríbenos a <a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>; procuramos responder en 30 días. También puedes presentar una reclamación ante tu autoridad de protección de datos. Los datos pueden transferirse a Estados Unidos mediante las Standard Contractual Clauses aprobadas por la Comisión Europea.</p></section><section><h2>14. Canadá — PIPEDA</h2><p>Si te encuentras en Canadá, tu información personal se rige por PIPEDA y las leyes provinciales aplicables. Recopilamos, usamos y divulgamos información personal solo con tu conocimiento y consentimiento y únicamente la necesaria para los fines descritos aquí. Puedes acceder a tu información, cuestionar su exactitud y retirar tu consentimiento, sujeto a restricciones legales o contractuales. Nuestro responsable de privacidad está disponible en <a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>.</p></section><section><h2>15. Australia — Privacy Act</h2><p>Si te encuentras en Australia, cumplimos la Privacy Act 1988 y los Australian Privacy Principles (APPs). Puedes acceder a la información personal que conservamos y solicitar la corrección de datos inexactos. Puedes presentar primero ante nosotros una reclamación por incumplimiento de los APPs y, si no se resuelve, ante la Oficina del Comisionado Australiano de Información (OAIC). La información de salud se considera información sensible y recibe protección reforzada.</p></section><section><h2>16. Soberanía de datos indígenas</h2><p>PauseWell respeta los principios de soberanía de datos indígenas. Para miembros de comunidades indígenas, incluidas las Nations Cherokee, Muscogee y otras: tus datos personales de salud te pertenecen a ti y a tu comunidad, no a PauseWell; apoyamos tu derecho a decidir cómo se recopilan, utilizan y comparten; no compartimos, agregamos ni utilizamos datos de salud de usuarios indígenas para investigación sin consentimiento tribal o comunitario explícito; respetamos los Principios CARE para la Gobernanza de Datos Indígenas — Beneficio colectivo, Autoridad para controlar, Responsabilidad y Ética. Las naciones tribales y comunidades indígenas pueden escribir a <a href='mailto:tribal@chronosai.com'>tribal@chronosai.com</a> para tratar acuerdos de gobernanza de datos.</p></section><section><h2>Contacto</h2><p>Si tienes preguntas sobre esta Política de privacidad o tus datos, escribe a <a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>.</p></section>","notice":"El texto legal en inglés es la versión autorizada."},"fr":{"title":"Politique de confidentialité — PauseWell","h1":"Politique de confidentialité de PauseWell","tag":"Vos données de santé vous appartiennent — toujours.","updated":"","intro":"PauseWell repose sur une promesse simple : vos données personnelles de santé vous appartiennent. Nous ne les vendons jamais, ne les partageons jamais avec des annonceurs et ne les utilisons jamais à d’autres fins que de vous offrir la meilleure expérience de bien-être possible.","body":"<section><h2>1. Qui sommes-nous</h2><p>PauseWell est un produit de SamInterest LLC d/b/a Chronos AI (« nous »), basée à Edmond, Oklahoma, États-Unis. Vous pouvez nous joindre à <a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>.</p></section><section><h2>2. Informations que nous collectons</h2><p>Informations fournies directement : informations de compte (nom, adresse e-mail et mot de passe) ; profil de santé (stade de ménopause et transitions) ; journaux de symptômes (type, intensité, moment, contexte et notes) ; saisies vocales (l’audio est traité immédiatement et n’est pas stocké ; seule la transcription est enregistrée) ; journal privé (humeur, énergie, réflexions et gratitude) ; données du cycle menstruel ; préférences de notification. Apple Health, uniquement avec votre autorisation explicite : analyse du sommeil, fréquence cardiaque, variabilité de la fréquence cardiaque (HRV) et nombre de pas. Les données Apple Health sont en lecture seule ; nous n’y écrivons jamais de données. Vous pouvez révoquer l’autorisation dans Réglages → Confidentialité et sécurité → Santé → PauseWell. Informations collectées automatiquement : statistiques d’utilisation de l’application (écrans consultés et fonctions utilisées), uniquement pour l’améliorer ; type d’appareil et version du système d’exploitation pour l’assistance technique ; rapports de plantage pour corriger les bugs.</p></section><section><h2>3. Comment nous utilisons vos informations</h2><p>Nous utilisons vos informations pour personnaliser votre expérience de bien-être ; générer des protocoles quotidiens personnalisés ; identifier les tendances et schémas de symptômes ; créer des rapports à partager avec votre médecin ; envoyer des rappels et notifications si vous les activez ; améliorer les fonctionnalités et la précision de PauseWell ; fournir une assistance ; et respecter nos obligations légales. Nous n’utilisons jamais vos données de santé pour entraîner des modèles d’IA externes, ne vendons vos données à aucun tiers, ne les partageons avec aucun assureur ou employeur et n’affichons aucune publicité fondée sur vos données de santé.</p></section><section><h2>4. Comment nous partageons vos informations</h2><p>Nous partageons des données uniquement de manière limitée : avec les prestataires nécessaires au fonctionnement de PauseWell — Supabase pour l’infrastructure de base de données, Deepgram pour le traitement vocal et Anthropic pour les fonctions d’IA/protocoles — soumis à des obligations contractuelles de protection des données ; selon vos instructions, par exemple lorsque vous générez ou partagez un rapport médical ; lorsque la loi l’exige ; ou dans le cadre d’un transfert d’entreprise. Nous ne vendons jamais vos informations personnelles de santé.</p></section><section><h2>5. Stockage et sécurité des données</h2><p>Vos données sont stockées sur des serveurs chiffrés fournis par Supabase et hébergés sur AWS. Nous utilisons un chiffrement conforme aux normes du secteur en transit (TLS) et au repos, et l’accès est limité au personnel autorisé. Les enregistrements vocaux sont traités en temps réel par l’API de Deepgram et ne sont pas stockés par PauseWell ; seule la transcription textuelle est enregistrée.</p></section><section><h2>6. Vos droits et vos choix</h2><p>Vous pouvez consulter vos données dans l’application ; exporter vos données de symptômes dans un rapport médical PDF ; corriger ou supprimer des journaux de symptômes et des entrées de journal ; supprimer votre compte et toutes les données associées via Réglages → Vous → Profil → Supprimer mon compte et mes données ; désactiver les notifications push via Réglages → Vous → Profil → Notifications ; et révoquer les autorisations Apple Health dans les réglages iOS.</p></section><section><h2>7. Conservation des données</h2><p>Nous conservons vos données tant que votre compte est actif. Lorsque vous supprimez votre compte, vos données personnelles sont définitivement supprimées dans un délai de 30 jours. Des données anonymisées et agrégées, sans identifiants personnels, peuvent être conservées à des fins de recherche.</p></section><section><h2>8. Confidentialité des mineurs</h2><p>PauseWell est conçu pour les adultes en périménopause et ménopause. Nous ne collectons pas sciemment d’informations concernant des personnes de moins de 18 ans. Si nous apprenons qu’un mineur de moins de 18 ans a fourni des informations personnelles, nous les supprimerons immédiatement.</p></section><section><h2>9. Droits à la vie privée en Californie (CCPA)</h2><p>Les résidents de Californie ont le droit de savoir quelles informations personnelles nous collectons, d’en demander la suppression, de refuser la vente d’informations personnelles (nous ne vendons pas d’informations personnelles) et de ne pas subir de discrimination pour l’exercice de ces droits. Pour les exercer, contactez <a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>.</p></section><section><h2>10. Utilisateurs internationaux</h2><p>PauseWell est exploité depuis les États-Unis. Si vous y accédez depuis l’étranger, vos informations peuvent être transférées et traitées aux États-Unis. En utilisant PauseWell, vous consentez à ce transfert.</p></section><section><h2>11. Modifications de cette politique</h2><p>Nous pouvons mettre à jour cette Politique de confidentialité. Nous vous informerons des modifications importantes par e-mail ou notification dans l’application. La poursuite de l’utilisation de PauseWell après une modification vaut acceptation de la politique mise à jour.</p></section><section><h2>12. Avis relatif aux informations de santé</h2><p>PauseWell est un outil de bien-être, et non un prestataire médical. Il ne fournit ni diagnostic, ni recommandation de traitement, ni conseil médical. Les informations et analyses de l’application sont uniquement destinées à l’information et au bien-être. Consultez un professionnel de santé qualifié pour vos besoins et décisions de santé.</p></section><section><h2>13. Union européenne — GDPR</h2><p>Si vous vous trouvez dans l’EEE, au Royaume-Uni ou en Suisse, nous traitons vos données conformément au GDPR applicable. Les bases juridiques comprennent l’exécution du contrat, nos intérêts légitimes, votre consentement pour les données de santé/Apple Health — que vous pouvez retirer — et nos obligations légales. Vos droits comprennent l’accès, la rectification, l’effacement (« droit à l’oubli »), la limitation, la portabilité, l’opposition et le retrait du consentement. Contactez <a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a> ; nous nous efforçons de répondre sous 30 jours. Vous pouvez également saisir votre autorité de protection des données. Les données peuvent être transférées aux États-Unis au moyen des Standard Contractual Clauses approuvées par la Commission européenne.</p></section><section><h2>14. Canada — PIPEDA</h2><p>Si vous êtes au Canada, vos renseignements personnels sont régis par la PIPEDA et les lois provinciales applicables. Nous ne collectons, utilisons et communiquons vos renseignements qu’avec votre connaissance et votre consentement et uniquement dans la mesure nécessaire aux fins décrites ici. Vous pouvez accéder à vos renseignements, contester leur exactitude et retirer votre consentement, sous réserve de restrictions légales ou contractuelles. Notre responsable de la confidentialité est joignable à <a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>.</p></section><section><h2>15. Australie — Privacy Act</h2><p>Si vous êtes en Australie, nous respectons le Privacy Act 1988 et les Australian Privacy Principles (APPs). Vous pouvez accéder aux informations personnelles que nous détenons et demander la correction d’informations inexactes. Vous pouvez d’abord nous adresser une plainte concernant une violation des APPs puis, si elle n’est pas résolue, saisir l’Bureau du Commissaire australien à l’information (OAIC). Les informations de santé sont considérées comme sensibles et bénéficient d’une protection renforcée.</p></section><section><h2>16. Souveraineté des données autochtones</h2><p>PauseWell respecte les principes de souveraineté des données autochtones. Pour les membres de communautés autochtones, notamment les Nations Cherokee, Muscogee et autres : vos données personnelles de santé vous appartiennent, à vous et à votre communauté, et non à PauseWell ; nous soutenons votre droit de décider comment elles sont collectées, utilisées et partagées ; nous ne partageons, n’agrégeons ni n’utilisons les données de santé des utilisateurs autochtones pour la recherche sans consentement tribal ou communautaire explicite ; nous respectons les Principes CARE pour la gouvernance des données autochtones — Bénéfice collectif, Autorité de contrôle, Responsabilité et Éthique. Les nations tribales et communautés autochtones peuvent contacter <a href='mailto:tribal@chronosai.com'>tribal@chronosai.com</a> pour discuter d’accords de gouvernance des données.</p></section><section><h2>Nous contacter</h2><p>Pour toute question concernant cette Politique de confidentialité ou vos données, contactez <a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>.</p></section>","notice":"Le texte juridique anglais constitue la version de référence."},"pt":{"title":"Política de Privacidade — PauseWell","h1":"Política de Privacidade do PauseWell","tag":"Seus dados de saúde pertencem a você — sempre.","updated":"","intro":"PauseWell foi criado com uma promessa simples: seus dados pessoais de saúde pertencem a você. Nunca os vendemos, nunca os compartilhamos com anunciantes e nunca os usamos para qualquer finalidade além de oferecer a melhor experiência de bem-estar possível.","body":"<section><h2>1. Quem somos</h2><p>PauseWell é um produto da SamInterest LLC d/b/a Chronos AI (“nós”), sediada em Edmond, Oklahoma, Estados Unidos. Fale conosco em <a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>.</p></section><section><h2>2. Informações que coletamos</h2><p>Informações fornecidas diretamente: dados da conta (nome, e-mail e senha); perfil de saúde (estágio da menopausa e transições); registros de sintomas (tipo, gravidade, horário, contexto e notas); entradas de voz (o áudio é processado imediatamente e não é armazenado; somente a transcrição é salva); diário privado (humor, energia, reflexões e gratidão); dados do ciclo menstrual; preferências de notificação. Apple Health, somente com sua permissão explícita: análise do sono, frequência cardíaca, variabilidade da frequência cardíaca (HRV) e contagem de passos. Os dados do Apple Health são somente leitura; nunca gravamos dados nele. Você pode revogar a permissão em Ajustes → Privacidade e segurança → Saúde → PauseWell. Informações coletadas automaticamente: análises de uso do aplicativo (telas e recursos utilizados), somente para melhorar o app; tipo de dispositivo e versão do sistema operacional para suporte técnico; relatórios de falhas para corrigir bugs.</p></section><section><h2>3. Como usamos suas informações</h2><p>Usamos suas informações para personalizar sua experiência de bem-estar; gerar protocolos diários personalizados; identificar padrões e tendências de sintomas; criar relatórios para compartilhar com seu médico; enviar lembretes e notificações se ativados; melhorar recursos e precisão do PauseWell; fornecer suporte; e cumprir obrigações legais. Nunca usamos seus dados de saúde para treinar modelos externos de IA, vendemos seus dados a terceiros, compartilhamos com seguradoras ou empregadores ou exibimos anúncios baseados em seus dados de saúde.</p></section><section><h2>4. Como compartilhamos suas informações</h2><p>Compartilhamos dados apenas de forma limitada: com prestadores necessários à operação do PauseWell — Supabase para infraestrutura de banco de dados, Deepgram para processamento de voz e Anthropic para recursos de IA/protocolos — sujeitos a obrigações contratuais de proteção de dados; quando você solicitar, como ao gerar ou compartilhar um relatório médico; quando exigido por lei; ou em uma transferência empresarial. Nunca vendemos suas informações pessoais de saúde.</p></section><section><h2>5. Armazenamento e segurança dos dados</h2><p>Seus dados são armazenados em servidores criptografados fornecidos pela Supabase e hospedados na AWS. Usamos criptografia padrão do setor em trânsito (TLS) e em repouso, e o acesso é restrito a pessoal autorizado. Gravações de voz são processadas em tempo real pela API da Deepgram e não são armazenadas pelo PauseWell; somente a transcrição de texto é salva.</p></section><section><h2>6. Seus direitos e escolhas</h2><p>Você pode acessar seus dados no aplicativo; exportar dados de sintomas por meio de um relatório médico em PDF; corrigir ou excluir registros individuais de sintomas e entradas do diário; excluir sua conta e todos os dados associados em Ajustes → Você → Perfil → Excluir minha conta e meus dados; desativar notificações push em Ajustes → Você → Perfil → Notificações; e revogar permissões do Apple Health nos Ajustes do iOS.</p></section><section><h2>7. Retenção de dados</h2><p>Mantemos seus dados enquanto sua conta estiver ativa. Ao excluir sua conta, seus dados pessoais são excluídos permanentemente em até 30 dias. Dados anonimizados e agregados, sem identificadores pessoais, podem ser mantidos para pesquisa.</p></section><section><h2>8. Privacidade de menores</h2><p>PauseWell é destinado a adultos na perimenopausa e menopausa. Não coletamos intencionalmente informações de menores de 18 anos. Se soubermos que um menor de 18 anos forneceu informações pessoais, elas serão excluídas imediatamente.</p></section><section><h2>9. Direitos de privacidade da Califórnia (CCPA)</h2><p>Residentes da Califórnia têm o direito de saber quais informações pessoais coletamos, solicitar sua exclusão, optar por não participar da venda de informações pessoais (não vendemos informações pessoais) e não sofrer discriminação por exercer esses direitos. Para exercê-los, contate <a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>.</p></section><section><h2>10. Usuários internacionais</h2><p>PauseWell é operado nos Estados Unidos. Se você acessar de fora dos EUA, suas informações poderão ser transferidas e processadas nos Estados Unidos. Ao usar o PauseWell, você concorda com essa transferência.</p></section><section><h2>11. Alterações nesta política</h2><p>Podemos atualizar esta Política de Privacidade periodicamente. Avisaremos sobre alterações significativas por e-mail ou notificação no aplicativo. O uso contínuo do PauseWell após alterações constitui aceitação da política atualizada.</p></section><section><h2>12. Aviso sobre informações de saúde</h2><p>PauseWell é uma ferramenta de bem-estar, não um prestador de serviços médicos. Não fornece diagnósticos, recomendações de tratamento ou aconselhamento médico. As informações e insights do aplicativo destinam-se somente a fins informativos e de bem-estar. Consulte um profissional de saúde qualificado sobre suas necessidades e decisões de saúde.</p></section><section><h2>13. União Europeia — GDPR</h2><p>Se você estiver no EEE, Reino Unido ou Suíça, processamos seus dados conforme o GDPR aplicável. As bases legais incluem execução de contrato, interesses legítimos, seu consentimento para dados de saúde/Apple Health — que pode ser retirado — e obrigações legais. Seus direitos incluem acesso, retificação, exclusão (“direito ao esquecimento”), restrição, portabilidade, oposição e retirada do consentimento. Contate <a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>; buscamos responder em até 30 dias. Você também pode reclamar à autoridade de proteção de dados. Os dados podem ser transferidos aos Estados Unidos usando as Standard Contractual Clauses aprovadas pela Comissão Europeia.</p></section><section><h2>14. Canadá — PIPEDA</h2><p>Se você estiver no Canadá, suas informações pessoais são regidas pela PIPEDA e pelas leis provinciais aplicáveis. Coletamos, usamos e divulgamos informações pessoais somente com seu conhecimento e consentimento e apenas o necessário para os fins descritos aqui. Você pode acessar suas informações, contestar sua exatidão e retirar o consentimento, sujeito a restrições legais ou contratuais. Nosso responsável por privacidade pode ser contatado em <a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>.</p></section><section><h2>15. Austrália — Privacy Act</h2><p>Se você estiver na Austrália, cumprimos o Privacy Act 1988 e os Australian Privacy Principles (APPs). Você pode acessar as informações pessoais que mantemos e solicitar correção de informações inexatas. Você pode reclamar primeiro conosco sobre uma violação dos APPs e, se não resolvida, com o Gabinete do Comissário Australiano de Informação (OAIC). Informações de saúde são consideradas sensíveis e recebem proteção reforçada.</p></section><section><h2>16. Soberania de dados indígenas</h2><p>PauseWell respeita os princípios de soberania de dados indígenas. Para membros de comunidades indígenas, incluindo as Nações Cherokee, Muscogee e outras: seus dados pessoais de saúde pertencem a você e à sua comunidade, não ao PauseWell; apoiamos seu direito de decidir como os dados são coletados, usados e compartilhados; não compartilhamos, agregamos nem usamos dados de saúde de usuários indígenas para pesquisa sem consentimento tribal ou comunitário explícito; respeitamos os Princípios CARE para Governança de Dados Indígenas — Benefício coletivo, Autoridade para controlar, Responsabilidade e Ética. Nações tribais e comunidades indígenas podem contatar <a href='mailto:tribal@chronosai.com'>tribal@chronosai.com</a> para discutir acordos de governança de dados.</p></section><section><h2>Fale conosco</h2><p>Se tiver dúvidas sobre esta Política de Privacidade ou seus dados, contate <a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>.</p></section>","notice":"O texto jurídico em inglês é a versão oficial."},"de":{"title":"Datenschutzerklärung — PauseWell","h1":"PauseWell Datenschutzerklärung","tag":"Deine Gesundheitsdaten gehören dir — immer.","updated":"","intro":"PauseWell basiert auf einem einfachen Versprechen: Deine persönlichen Gesundheitsdaten gehören dir. Wir verkaufen sie niemals, geben sie niemals an Werbetreibende weiter und verwenden sie ausschließlich, um dir die bestmögliche Wellness-Erfahrung zu bieten.","body":"<section><h2>1. Wer wir sind</h2><p>PauseWell ist ein Produkt von SamInterest LLC d/b/a Chronos AI („wir“) mit Sitz in Edmond, Oklahoma, USA. Du erreichst uns unter <a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>.</p></section><section><h2>2. Welche Informationen wir erheben</h2><p>Informationen, die du direkt angibst: Kontodaten (Name, E-Mail-Adresse und Passwort); Gesundheitsprofil (Menopausenphase und Übergänge); Symptomprotokolle (Art, Stärke, Zeitpunkt, Kontext und Notizen); Spracheinträge (Audio wird sofort verarbeitet und nicht gespeichert; nur das Texttranskript wird gespeichert); privates Journal (Stimmung, Energie, Reflexionen und Dankbarkeit); Menstruationszyklusdaten; Benachrichtigungseinstellungen. Apple Health, nur mit deiner ausdrücklichen Erlaubnis: Schlafanalyse, Herzfrequenz, Herzfrequenzvariabilität (HRV) und Schrittzahl. Apple-Health-Daten werden nur gelesen; wir schreiben niemals Daten zurück. Du kannst die Erlaubnis unter Einstellungen → Datenschutz und Sicherheit → Gesundheit → PauseWell widerrufen. Automatisch erhobene Informationen: App-Nutzungsanalysen (angesehene Bildschirme und verwendete Funktionen) ausschließlich zur Verbesserung der App; Gerätetyp und Betriebssystemversion für technischen Support; Absturzberichte zur Fehlerbehebung.</p></section><section><h2>3. Wie wir deine Informationen verwenden</h2><p>Wir verwenden deine Informationen, um deine Wellness-Erfahrung zu personalisieren, personalisierte Tagesprotokolle zu erstellen, Muster und Trends deiner Symptome zu erkennen, Berichte zum Teilen mit deiner Ärztin oder deinem Arzt zu erstellen, aktivierte Erinnerungen und Benachrichtigungen zu senden, Funktionen und Genauigkeit von PauseWell zu verbessern, Support zu leisten und rechtliche Pflichten zu erfüllen. Wir verwenden deine Gesundheitsdaten niemals zum Training externer KI-Modelle, verkaufen sie nicht an Dritte, geben sie nicht an Versicherer oder Arbeitgeber weiter und zeigen keine Werbung auf Grundlage deiner Gesundheitsdaten.</p></section><section><h2>4. Wie wir Informationen weitergeben</h2><p>Wir geben Daten nur begrenzt weiter: an Dienstleister, die für PauseWell erforderlich sind — Supabase für Datenbankinfrastruktur, Deepgram für Sprachverarbeitung und Anthropic für KI-/Protokollfunktionen — und die vertraglich zum Datenschutz verpflichtet sind; auf deine Anweisung, etwa beim Erstellen oder Teilen eines Arztberichts; wenn gesetzlich vorgeschrieben; oder im Rahmen einer Unternehmensübertragung. Wir verkaufen deine persönlichen Gesundheitsinformationen niemals.</p></section><section><h2>5. Datenspeicherung und Sicherheit</h2><p>Deine Daten werden auf verschlüsselten Servern von Supabase gespeichert, die auf AWS gehostet werden. Wir verwenden branchenübliche Verschlüsselung bei der Übertragung (TLS) und im Ruhezustand; der Zugriff ist auf autorisiertes Personal beschränkt. Sprachaufnahmen werden in Echtzeit durch die Deepgram-API verarbeitet und von PauseWell nicht gespeichert; nur das Texttranskript wird gespeichert.</p></section><section><h2>6. Deine Rechte und Wahlmöglichkeiten</h2><p>Du kannst deine Daten in der App einsehen; Symptomdaten als PDF-Arztbericht exportieren; einzelne Symptomprotokolle und Journaleinträge korrigieren oder löschen; dein Konto und alle zugehörigen Daten unter Einstellungen → Du → Profil → Mein Konto und meine Daten löschen löschen; Push-Benachrichtigungen unter Einstellungen → Du → Profil → Benachrichtigungen deaktivieren; und Apple-Health-Berechtigungen in den iOS-Einstellungen widerrufen.</p></section><section><h2>7. Datenspeicherdauer</h2><p>Wir speichern deine Daten, solange dein Konto aktiv ist. Wenn du dein Konto löschst, werden deine personenbezogenen Daten innerhalb von 30 Tagen dauerhaft gelöscht. Anonymisierte, aggregierte Daten ohne persönliche Identifikatoren können für Forschungszwecke aufbewahrt werden.</p></section><section><h2>8. Datenschutz von Minderjährigen</h2><p>PauseWell ist für Erwachsene in Perimenopause und Menopause bestimmt. Wir erheben wissentlich keine Daten von Personen unter 18 Jahren. Wenn wir erfahren, dass eine Person unter 18 personenbezogene Daten bereitgestellt hat, löschen wir diese unverzüglich.</p></section><section><h2>9. Datenschutzrechte in Kalifornien (CCPA)</h2><p>Einwohner Kaliforniens haben das Recht zu erfahren, welche personenbezogenen Daten wir erheben, deren Löschung zu verlangen, dem Verkauf personenbezogener Daten zu widersprechen (wir verkaufen keine personenbezogenen Daten) und wegen der Ausübung dieser Rechte nicht diskriminiert zu werden. Wende dich dazu an <a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>.</p></section><section><h2>10. Internationale Nutzer</h2><p>PauseWell wird von den USA aus betrieben. Wenn du PauseWell außerhalb der USA nutzt, können deine Informationen in die USA übertragen und dort verarbeitet werden. Durch die Nutzung von PauseWell stimmst du dieser Übertragung zu.</p></section><section><h2>11. Änderungen dieser Richtlinie</h2><p>Wir können diese Datenschutzerklärung von Zeit zu Zeit aktualisieren. Über wesentliche Änderungen informieren wir dich per E-Mail oder In-App-Benachrichtigung. Die weitere Nutzung von PauseWell nach Änderungen gilt als Zustimmung zur aktualisierten Richtlinie.</p></section><section><h2>12. Hinweis zu Gesundheitsinformationen</h2><p>PauseWell ist ein Wellness-Tool und kein medizinischer Anbieter. Es stellt keine Diagnosen, Behandlungsempfehlungen oder medizinische Beratung bereit. Informationen und Erkenntnisse in der App dienen nur Informations- und Wellnesszwecken. Besprich gesundheitliche Bedürfnisse und Entscheidungen mit qualifiziertem medizinischem Fachpersonal.</p></section><section><h2>13. Europäische Union — GDPR</h2><p>Wenn du dich im EWR, im Vereinigten Königreich oder in der Schweiz befindest, verarbeiten wir deine Daten gemäß der anwendbaren GDPR. Rechtsgrundlagen sind Vertragserfüllung, berechtigte Interessen, deine Einwilligung für Gesundheits-/Apple-Health-Daten — die du widerrufen kannst — und gesetzliche Pflichten. Deine Rechte umfassen Auskunft, Berichtigung, Löschung („Recht auf Vergessenwerden“), Einschränkung, Datenübertragbarkeit, Widerspruch und Widerruf der Einwilligung. Kontaktiere <a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>; wir bemühen uns um eine Antwort innerhalb von 30 Tagen. Du kannst dich auch bei deiner Datenschutzbehörde beschweren. Daten können mithilfe der von der Europäischen Kommission genehmigten Standardvertragsklauseln in die USA übertragen werden.</p></section><section><h2>14. Kanada — PIPEDA</h2><p>Wenn du dich in Kanada befindest, unterliegen deine personenbezogenen Daten PIPEDA und den anwendbaren Datenschutzgesetzen der Provinzen. Wir erheben, verwenden und geben personenbezogene Daten nur mit deinem Wissen und deiner Einwilligung und nur soweit für die hier genannten Zwecke erforderlich weiter. Du kannst auf deine Daten zugreifen, ihre Richtigkeit anfechten und deine Einwilligung vorbehaltlich gesetzlicher oder vertraglicher Einschränkungen widerrufen. Unsere Datenschutzbeauftragten erreichst du unter <a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>.</p></section><section><h2>15. Australien — Privacy Act</h2><p>Wenn du dich in Australien befindest, halten wir den Privacy Act 1988 und die Australian Privacy Principles (APPs) ein. Du kannst auf personenbezogene Daten zugreifen, die wir über dich gespeichert haben, und die Berichtigung unrichtiger Daten verlangen. Beschwerden über Verstöße gegen die APPs kannst du zunächst an uns und, wenn ungelöst, an das Amt des australischen Informationsbeauftragten (OAIC) richten. Gesundheitsinformationen gelten als sensible Informationen und genießen erhöhten Schutz.</p></section><section><h2>16. Indigene Datensouveränität</h2><p>PauseWell respektiert die Grundsätze indigener Datensouveränität. Für Mitglieder indigener Gemeinschaften, einschließlich Cherokee, Muscogee und anderer Nations, gilt: Deine persönlichen Gesundheitsdaten gehören dir und deiner Gemeinschaft, nicht PauseWell; wir unterstützen dein Recht zu bestimmen, wie Daten über dich erhoben, verwendet und geteilt werden; wir teilen, aggregieren oder verwenden Gesundheitsdaten indigener Nutzer nicht für Forschung ohne ausdrückliche Zustimmung des Stammes oder der Gemeinschaft; wir respektieren die CARE-Prinzipien für indigene Datenverwaltung — Kollektiver Nutzen, Kontrollbefugnis, Verantwortung und Ethik. Stammesnationen und indigene Gemeinschaften können unter <a href='mailto:tribal@chronosai.com'>tribal@chronosai.com</a> Vereinbarungen zur Datenverwaltung besprechen.</p></section><section><h2>Kontakt</h2><p>Bei Fragen zu dieser Datenschutzerklärung oder deinen Daten kontaktiere <a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>.</p></section>","notice":"Der englische Rechtstext ist die maßgebliche Fassung."},"ja":{"title":"プライバシーポリシー — PauseWell","h1":"PauseWell プライバシーポリシー","tag":"あなたの健康データは、常にあなたのものです。","updated":"","intro":"PauseWellは、個人の健康データは本人のものであるというシンプルな約束に基づいています。当社はそれを販売せず、広告主と共有せず、可能な限り優れたウェルネス体験を提供する目的以外には使用しません。","body":"<section><h2>1. 当社について</h2><p>PauseWellは、米国オクラホマ州エドモンドに拠点を置くSamInterest LLC d/b/a Chronos AI（「当社」）の製品です。<a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>までお問い合わせいただけます。</p></section><section><h2>2. 収集する情報</h2><p>利用者が直接提供する情報：アカウント情報（氏名、メールアドレス、パスワード）、健康プロフィール（閉経段階とその移行）、症状ログ（種類、重症度、時刻、状況、メモ）、音声入力（音声は直ちに処理され保存されず、生成された文字起こしのみ保存）、非公開ジャーナル（気分、エネルギー、振り返り、感謝）、月経周期データ、通知設定。明示的な許可を得たApple Health情報：睡眠分析、心拍数、心拍変動（HRV）、歩数。Apple Healthデータは読み取り専用で、当社がApple Healthへデータを書き込むことはありません。設定 → プライバシーとセキュリティ → ヘルスケア → PauseWellで許可を取り消せます。自動的に収集する情報：アプリ改善のためだけに使用する利用分析（閲覧画面・使用機能）、技術サポートのための端末種類・OSバージョン、バグ修正のためのクラッシュレポート。</p></section><section><h2>3. 情報の利用方法</h2><p>情報は、ウェルネス体験のパーソナライズ、個別の日次プロトコル作成、症状のパターン・傾向の把握、医師と共有するレポート作成、有効にしたリマインダー・通知の送信、PauseWellの機能・精度改善、サポート提供、法的義務の履行に使用します。健康データを外部AIモデルの学習に使用したり、第三者へ販売したり、保険会社や雇用主と共有したり、健康データに基づく広告を表示したりすることは決してありません。</p></section><section><h2>4. 情報の共有方法</h2><p>データ共有は限定的です。PauseWellの運営に必要なサービス提供者 — データベース基盤のSupabase、音声処理のDeepgram、AI／プロトコル機能のAnthropic — には契約上のデータ保護義務を課します。また、医師向けレポートの生成・共有など利用者の指示がある場合、法令で求められる場合、事業譲渡の場合に共有することがあります。個人の健康情報を販売することは決してありません。</p></section><section><h2>5. データの保存とセキュリティ</h2><p>データはAWS上でホストされるSupabaseの暗号化サーバーに保存されます。転送中（TLS）および保存時に業界標準の暗号化を使用し、アクセスは権限を持つ担当者に限定します。音声録音はDeepgram APIによりリアルタイム処理され、PauseWellには保存されません。生成された文字起こしのみ保存されます。</p></section><section><h2>6. 利用者の権利と選択肢</h2><p>アプリ内でデータを閲覧し、症状データをPDF医師向けレポートとして書き出し、個別の症状ログやジャーナルを修正・削除できます。設定 → あなた → プロフィール → アカウントとデータを削除からアカウントと関連データを削除し、設定 → あなた → プロフィール → 通知からプッシュ通知を無効にし、iOS設定からApple Healthの許可を取り消せます。</p></section><section><h2>7. データ保持</h2><p>アカウントが有効な間、データを保持します。アカウント削除後、個人データは30日以内に恒久的に削除されます。個人識別子を含まない匿名化・集計データは研究目的で保持する場合があります。</p></section><section><h2>8. 子どものプライバシー</h2><p>PauseWellは周閉経期および閉経期の成人向けです。18歳未満から意図的に情報を収集しません。18歳未満の者が個人情報を提供したことが判明した場合、直ちに削除します。</p></section><section><h2>9. カリフォルニア州のプライバシー権（CCPA）</h2><p>カリフォルニア州居住者には、当社が収集する個人情報を知る権利、削除を求める権利、個人情報の販売を拒否する権利（当社は販売しません）、権利行使を理由に差別されない権利があります。<a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>までご連絡ください。</p></section><section><h2>10. 海外の利用者</h2><p>PauseWellは米国から運営されています。米国外から利用する場合、情報が米国へ移転され、米国内で処理されることがあります。PauseWellを利用することで、この移転に同意するものとします。</p></section><section><h2>11. 本ポリシーの変更</h2><p>本プライバシーポリシーを随時更新することがあります。重要な変更はメールまたはアプリ内通知でお知らせします。変更後もPauseWellを継続利用した場合、更新後のポリシーに同意したものとみなされます。</p></section><section><h2>12. 健康情報に関する通知</h2><p>PauseWellはウェルネスツールであり、医療提供者ではありません。診断、治療の推奨、医療助言を提供しません。アプリ内の情報とインサイトは情報提供・ウェルネス目的に限られます。健康上の必要事項や判断については、資格を有する医療従事者に相談してください。</p></section><section><h2>13. 欧州連合 — GDPR</h2><p>EEA、英国またはスイスに所在する場合、適用されるGDPRに従ってデータを処理します。法的根拠には契約の履行、正当な利益、健康／Apple Healthデータについての撤回可能な同意、法的義務があります。権利にはアクセス、訂正、消去（「忘れられる権利」）、処理制限、データポータビリティ、異議申立て、同意撤回があります。<a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>までご連絡ください。30日以内の回答に努めます。監督機関へ苦情を申し立てることもできます。データは欧州委員会承認のStandard Contractual Clausesを用いて米国へ移転される場合があります。</p></section><section><h2>14. カナダ — PIPEDA</h2><p>カナダに所在する場合、個人情報にはPIPEDAおよび適用される州のプライバシー法が適用されます。当社は利用者の認識と同意のもと、本ポリシー記載の目的に必要な情報のみを収集・利用・開示します。利用者は情報へのアクセス、正確性への異議申立て、法的・契約上の制限に従った同意撤回ができます。<a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>で連絡できます。</p></section><section><h2>15. オーストラリア — Privacy Act</h2><p>オーストラリアに所在する場合、Australian Privacy Act 1988およびAustralian Privacy Principles（APPs）を遵守します。保有する個人情報へのアクセスと不正確な情報の訂正を求めることができます。APPs違反についてまず当社に苦情を申し立て、解決しない場合はオーストラリア情報コミッショナー事務局（OAIC）へ申し立てることができます。健康情報は機微情報として強化された保護を受けます。</p></section><section><h2>16. 先住民族データ主権</h2><p>PauseWellは先住民族データ主権の原則を尊重します。Cherokee、Muscogeeその他のNationsを含む先住民族コミュニティの利用者について、個人の健康データはPauseWellではなく本人とコミュニティに帰属します。当社はデータの収集・利用・共有を統治する権利を支持し、部族またはコミュニティの明示的同意なしに先住民族利用者の健康データを研究目的で共有、集計、利用しません。先住民族データガバナンスのCARE原則 — 集合的利益, 管理権限, 責任, 倫理 — を尊重します。<a href='mailto:tribal@chronosai.com'>tribal@chronosai.com</a>までご連絡ください。</p></section><section><h2>お問い合わせ</h2><p>本プライバシーポリシーまたはデータについてのご質問は<a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>までお問い合わせください。</p></section>","notice":"英語の法的文書が正式な基準文書です。"},"ko":{"title":"개인정보 처리방침 — PauseWell","h1":"PauseWell 개인정보 처리방침","tag":"건강 데이터는 언제나 귀하의 것입니다.","updated":"","intro":"PauseWell은 개인 건강 데이터는 귀하의 것이라는 단순한 약속을 바탕으로 합니다. 당사는 이를 판매하지 않고 광고주와 공유하지 않으며, 가능한 최상의 웰니스 경험을 제공하는 목적 외에는 사용하지 않습니다.","body":"<section><h2>1. 회사 소개</h2><p>PauseWell은 미국 오클라호마주 에드먼드에 소재한 SamInterest LLC d/b/a Chronos AI(“당사”)의 제품입니다. <a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>으로 문의할 수 있습니다.</p></section><section><h2>2. 수집하는 정보</h2><p>직접 제공하는 정보: 계정 정보(이름, 이메일 주소, 비밀번호), 건강 프로필(폐경 단계 및 변화), 증상 기록(유형, 심각도, 시점, 맥락, 메모), 음성 입력(오디오는 즉시 처리되고 저장되지 않으며 결과 텍스트만 저장), 비공개 저널(기분, 에너지, 성찰, 감사), 월경 주기 데이터, 알림 설정. 명시적 허가를 받은 Apple Health 정보: 수면 분석, 심박수, 심박변이도(HRV), 걸음 수. Apple Health 데이터는 읽기 전용이며 당사는 Apple Health에 데이터를 기록하지 않습니다. 설정 → 개인정보 보호 및 보안 → 건강 → PauseWell에서 권한을 취소할 수 있습니다. 자동 수집 정보: 앱 개선에만 사용하는 이용 분석(조회 화면, 사용 기능), 기술 지원을 위한 기기 유형 및 운영체제 버전, 버그 수정을 위한 충돌 보고서.</p></section><section><h2>3. 정보 이용 방법</h2><p>정보는 웰니스 경험 개인화, 맞춤형 일일 프로토콜 생성, 증상 패턴 및 추세 파악, 의사와 공유할 보고서 생성, 사용자가 활성화한 알림 전송, PauseWell 기능 및 정확도 개선, 고객 지원, 법적 의무 이행에 사용됩니다. 건강 데이터를 외부 AI 모델 학습에 사용하거나, 제3자에게 판매하거나, 보험사 또는 고용주와 공유하거나, 건강 데이터 기반 광고를 표시하는 일은 절대 없습니다.</p></section><section><h2>4. 정보 공유 방법</h2><p>데이터는 제한적으로만 공유됩니다. PauseWell 운영에 필요한 서비스 제공자 — 데이터베이스 인프라의 Supabase, 음성 처리의 Deepgram, AI/프로토콜 기능의 Anthropic — 는 계약상 데이터 보호 의무를 부담합니다. 또한 의사 보고서를 생성하거나 공유하는 등 사용자의 지시에 따른 경우, 법률상 요구되는 경우 또는 사업 이전 시 공유할 수 있습니다. 개인 건강 정보를 절대 판매하지 않습니다.</p></section><section><h2>5. 데이터 저장 및 보안</h2><p>데이터는 AWS에서 호스팅되는 Supabase의 암호화 서버에 저장됩니다. 전송 중(TLS) 및 저장 시 업계 표준 암호화를 사용하며, 데이터 접근은 권한 있는 인력으로 제한됩니다. 음성 녹음은 Deepgram API에서 실시간 처리되며 PauseWell이 저장하지 않습니다. 결과 텍스트만 저장됩니다.</p></section><section><h2>6. 귀하의 권리와 선택</h2><p>앱에서 데이터를 확인하고, 증상 데이터를 PDF 의사 보고서로 내보내고, 개별 증상 기록과 저널을 수정 또는 삭제할 수 있습니다. 설정 → 나 → 프로필 → 내 계정 및 데이터 삭제에서 계정과 관련 데이터를 삭제하고, 설정 → 나 → 프로필 → 알림에서 푸시 알림을 해제하며, iOS 설정에서 Apple Health 권한을 취소할 수 있습니다.</p></section><section><h2>7. 데이터 보존</h2><p>계정이 활성 상태인 동안 데이터를 보존합니다. 계정을 삭제하면 개인 데이터는 30일 이내에 영구 삭제됩니다. 개인 식별자가 없는 익명화·집계 데이터는 연구 목적으로 보존될 수 있습니다.</p></section><section><h2>8. 아동 개인정보 보호</h2><p>PauseWell은 폐경 전후기와 폐경을 경험하는 성인을 위한 서비스입니다. 만 18세 미만의 정보를 의도적으로 수집하지 않습니다. 만 18세 미만이 개인정보를 제공한 사실을 알게 되면 즉시 삭제합니다.</p></section><section><h2>9. 캘리포니아 개인정보 보호 권리(CCPA)</h2><p>캘리포니아 거주자는 당사가 수집하는 개인정보를 알 권리, 삭제를 요청할 권리, 개인정보 판매를 거부할 권리(당사는 개인정보를 판매하지 않음), 이러한 권리 행사로 차별받지 않을 권리가 있습니다. <a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>으로 문의하십시오.</p></section><section><h2>10. 국제 사용자</h2><p>PauseWell은 미국에서 운영됩니다. 미국 외 지역에서 접속하는 경우 정보가 미국으로 이전되어 처리될 수 있습니다. PauseWell을 이용함으로써 이러한 이전에 동의합니다.</p></section><section><h2>11. 정책 변경</h2><p>당사는 본 개인정보 처리방침을 수시로 업데이트할 수 있습니다. 중요한 변경은 이메일 또는 앱 내 알림으로 안내합니다. 변경 후 PauseWell을 계속 이용하면 업데이트된 정책에 동의한 것으로 간주됩니다.</p></section><section><h2>12. 건강 정보 고지</h2><p>PauseWell은 웰니스 도구이며 의료 제공자가 아닙니다. 진단, 치료 권고 또는 의료 조언을 제공하지 않습니다. 앱의 정보와 인사이트는 정보 제공 및 웰니스 목적에 한합니다. 건강상의 필요와 결정은 자격을 갖춘 의료 전문가와 상담하십시오.</p></section><section><h2>13. 유럽연합 — GDPR</h2><p>EEA, 영국 또는 스위스에 있는 경우 적용되는 GDPR에 따라 데이터를 처리합니다. 법적 근거에는 계약 이행, 정당한 이익, 건강/Apple Health 데이터에 대한 철회 가능한 동의, 법적 의무가 포함됩니다. 귀하의 권리에는 접근, 정정, 삭제(“잊힐 권리”), 처리 제한, 데이터 이동성, 이의 제기 및 동의 철회가 포함됩니다. <a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>으로 문의하면 30일 이내 답변하도록 노력합니다. 감독기관에 불만을 제기할 수도 있습니다. 데이터는 유럽위원회가 승인한 Standard Contractual Clauses를 통해 미국으로 이전될 수 있습니다.</p></section><section><h2>14. 캐나다 — PIPEDA</h2><p>캐나다에 있는 경우 개인정보는 PIPEDA 및 적용되는 주 개인정보 보호법의 적용을 받습니다. 당사는 귀하가 알고 동의한 경우에만, 본 정책에서 정한 목적에 필요한 정보만 수집·이용·공개합니다. 귀하는 개인정보에 접근하고 정확성에 이의를 제기하며, 법적 또는 계약상 제한에 따라 동의를 철회할 수 있습니다. <a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>으로 연락할 수 있습니다.</p></section><section><h2>15. 호주 — Privacy Act</h2><p>호주에 있는 경우 Australian Privacy Act 1988 및 Australian Privacy Principles(APPs)를 준수합니다. 당사가 보유한 개인정보에 접근하고 부정확한 정보의 수정을 요청할 수 있습니다. APPs 위반에 대해 먼저 당사에 불만을 제기하고, 해결되지 않으면 호주 정보위원회(OAIC)에 제기할 수 있습니다. 건강 정보는 민감정보로 취급되어 강화된 보호를 받습니다.</p></section><section><h2>16. 원주민 데이터 주권</h2><p>PauseWell은 원주민 데이터 주권 원칙을 존중합니다. Cherokee, Muscogee 및 기타 Nations를 포함한 원주민 공동체 구성원의 경우 개인 건강 데이터는 PauseWell이 아니라 본인과 공동체에 속합니다. 당사는 데이터의 수집·이용·공유 방식을 결정할 권리를 지지하며, 명시적인 부족 또는 공동체 동의 없이 원주민 사용자의 건강 데이터를 연구 목적으로 공유·집계·사용하지 않습니다. 원주민 데이터 거버넌스를 위한 CARE 원칙 — 공동체의 이익, 통제 권한, 책임, 윤리 — 를 존중합니다. <a href='mailto:tribal@chronosai.com'>tribal@chronosai.com</a>으로 데이터 거버넌스 협약을 논의할 수 있습니다.</p></section><section><h2>문의</h2><p>본 개인정보 처리방침 또는 데이터에 관한 질문은 <a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>으로 문의하십시오.</p></section>","notice":"영문 법률 문서가 공식 기준본입니다."},"ar":{"title":"سياسة الخصوصية — PauseWell","h1":"سياسة خصوصية PauseWell","tag":"بياناتك الصحية ملك لك — دائمًا.","updated":"","intro":"بُني PauseWell على وعد بسيط: بياناتك الصحية الشخصية ملك لك. نحن لا نبيعها أبدًا، ولا نشاركها مع المعلنين، ولا نستخدمها لأي غرض سوى تقديم أفضل تجربة عافية ممكنة لك.","body":"<section><h2>1. من نحن</h2><p>PauseWell منتج تابع لشركة SamInterest LLC d/b/a Chronos AI (“نحن”) ومقرها في إدموند، أوكلاهوما، الولايات المتحدة. يمكن التواصل معنا عبر <a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>.</p></section><section><h2>2. المعلومات التي نجمعها</h2><p>المعلومات التي تقدمينها مباشرة: معلومات الحساب (الاسم والبريد الإلكتروني وكلمة المرور)، الملف الصحي (مرحلة انقطاع الطمث وانتقالاتها)، سجلات الأعراض (النوع والشدة والتوقيت والسياق والملاحظات)، الإدخالات الصوتية (تُعالج التسجيلات فورًا ولا تُخزن كصوت؛ يُحفظ النص الناتج فقط)، اليوميات الخاصة (المزاج والطاقة والتأملات والامتنان)، بيانات الدورة الشهرية، وتفضيلات الإشعارات. معلومات Apple Health، بإذنك الصريح فقط: تحليل النوم، معدل ضربات القلب، تباين معدل ضربات القلب (HRV)، وعدد الخطوات. بيانات Apple Health للقراءة فقط ولا نكتب بيانات إليه. يمكنك إلغاء الإذن من الإعدادات → الخصوصية والأمان → الصحة → PauseWell. المعلومات التي تُجمع تلقائيًا: تحليلات استخدام التطبيق (الشاشات والميزات المستخدمة) لتحسين التطبيق فقط، نوع الجهاز وإصدار نظام التشغيل للدعم الفني، وتقارير الأعطال لإصلاح الأخطاء.</p></section><section><h2>3. كيفية استخدام معلوماتك</h2><p>نستخدم معلوماتك لتخصيص تجربة العافية؛ إنشاء بروتوكولات يومية مخصصة؛ تحديد أنماط الأعراض واتجاهاتها؛ إنشاء تقارير لمشاركتها مع طبيبك؛ إرسال التذكيرات والإشعارات إذا فعّلتها؛ تحسين ميزات PauseWell ودقته؛ تقديم الدعم؛ والوفاء بالالتزامات القانونية. نحن لا نستخدم بياناتك الصحية لتدريب نماذج ذكاء اصطناعي خارجية، ولا نبيع بياناتك لأطراف ثالثة، ولا نشاركها مع شركات التأمين أو أصحاب العمل، ولا نعرض إعلانات مبنية على بياناتك الصحية.</p></section><section><h2>4. كيفية مشاركة معلوماتك</h2><p>نشارك البيانات بشكل محدود فقط: مع مقدمي الخدمات اللازمين لتشغيل PauseWell — Supabase للبنية التحتية لقاعدة البيانات، وDeepgram لمعالجة الصوت، وAnthropic لميزات الذكاء الاصطناعي/البروتوكولات — مع التزامات تعاقدية بحماية البيانات؛ وبناءً على توجيهك مثل إنشاء أو مشاركة تقرير طبي؛ أو عندما يقتضي القانون؛ أو ضمن نقل الأعمال. لا نبيع معلوماتك الصحية الشخصية أبدًا.</p></section><section><h2>5. تخزين البيانات وأمانها</h2><p>تُخزن بياناتك على خوادم مشفرة توفرها Supabase ومستضافة على AWS. نستخدم تشفيرًا وفق معايير الصناعة أثناء النقل (TLS) وفي حالة التخزين، ويقتصر الوصول على الموظفين المصرح لهم. تعالج API الخاصة بـ Deepgram التسجيلات الصوتية في الوقت الفعلي ولا يخزنها PauseWell؛ يُحفظ النص الناتج فقط.</p></section><section><h2>6. حقوقك وخياراتك</h2><p>يمكنك عرض بياناتك داخل التطبيق؛ تصدير بيانات الأعراض في تقرير طبي بصيغة PDF؛ تصحيح أو حذف سجلات الأعراض وإدخالات اليوميات؛ حذف حسابك وجميع البيانات المرتبطة به من الإعدادات → أنت → الملف الشخصي → حذف حسابي وبياناتي؛ إيقاف إشعارات الدفع من الإعدادات → أنت → الملف الشخصي → الإشعارات؛ وإلغاء أذونات Apple Health من إعدادات iOS.</p></section><section><h2>7. الاحتفاظ بالبيانات</h2><p>نحتفظ ببياناتك ما دام حسابك نشطًا. عند حذف حسابك، تُحذف بياناتك الشخصية نهائيًا خلال 30 يومًا. قد نحتفظ ببيانات مجهولة الهوية ومجمعة، من دون معرفات شخصية، لأغراض البحث.</p></section><section><h2>8. خصوصية الأطفال</h2><p>PauseWell مخصص للبالغين في مرحلتي ما قبل انقطاع الطمث وانقطاعه. لا نجمع عن علم معلومات من أي شخص دون 18 عامًا. إذا علمنا أن شخصًا دون 18 عامًا قدم معلومات شخصية، فسنحذفها فورًا.</p></section><section><h2>9. حقوق الخصوصية في كاليفورنيا (CCPA)</h2><p>يحق لسكان كاليفورنيا معرفة المعلومات الشخصية التي نجمعها، وطلب حذفها، ورفض بيع المعلومات الشخصية (نحن لا نبيع المعلومات الشخصية)، وعدم التعرض للتمييز بسبب ممارسة هذه الحقوق. تواصلي عبر <a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>.</p></section><section><h2>10. المستخدمون الدوليون</h2><p>يُشغّل PauseWell من الولايات المتحدة. إذا استخدمته من خارج الولايات المتحدة، فقد تُنقل معلوماتك إلى الولايات المتحدة وتُعالج فيها. باستخدام PauseWell، فإنك توافقين على هذا النقل.</p></section><section><h2>11. تغييرات هذه السياسة</h2><p>قد نحدّث سياسة الخصوصية هذه من وقت لآخر. سنبلغك بالتغييرات المهمة عبر البريد الإلكتروني أو إشعار داخل التطبيق. استمرار استخدام PauseWell بعد التغييرات يعني قبول السياسة المحدثة.</p></section><section><h2>12. إشعار المعلومات الصحية</h2><p>PauseWell أداة للعافية وليس مقدم رعاية طبية. لا يقدم تشخيصات أو توصيات علاجية أو نصائح طبية. المعلومات والرؤى داخل التطبيق مخصصة لأغراض المعلومات والعافية فقط. استشيري مقدم رعاية صحية مؤهلًا بشأن احتياجاتك وقراراتك الصحية.</p></section><section><h2>13. الاتحاد الأوروبي — GDPR</h2><p>إذا كنت في المنطقة الاقتصادية الأوروبية أو المملكة المتحدة أو سويسرا، نعالج بياناتك وفق GDPR المطبق. تشمل الأسس القانونية تنفيذ العقد، والمصالح المشروعة، وموافقتك على بيانات الصحة/Apple Health — ويمكن سحبها — والالتزامات القانونية. تشمل حقوقك الوصول والتصحيح والمحو (“الحق في النسيان”) والتقييد وقابلية نقل البيانات والاعتراض وسحب الموافقة. تواصلي عبر <a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>؛ ونسعى للرد خلال 30 يومًا. يمكنك أيضًا تقديم شكوى إلى سلطة حماية البيانات. قد تُنقل البيانات إلى الولايات المتحدة باستخدام Standard Contractual Clauses المعتمدة من المفوضية الأوروبية.</p></section><section><h2>14. كندا — PIPEDA</h2><p>إذا كنت في كندا، تخضع معلوماتك الشخصية لـ PIPEDA وقوانين الخصوصية الإقليمية المطبقة. نجمع معلوماتك ونستخدمها ونفصح عنها فقط بعلمك وموافقتك وبالقدر اللازم للأغراض الموضحة هنا. يحق لك الوصول إلى معلوماتك والطعن في دقتها وسحب الموافقة، مع مراعاة القيود القانونية أو التعاقدية. يمكن التواصل عبر <a href='mailto:privacy@chronosai.com'>privacy@chronosai.com</a>.</p></section><section><h2>15. أستراليا — Privacy Act</h2><p>إذا كنت في أستراليا، نلتزم بـ Australian Privacy Act 1988 وAustralian Privacy Principles (APPs). يحق لك الوصول إلى المعلومات الشخصية التي نحتفظ بها وطلب تصحيح المعلومات غير الدقيقة. يمكنك تقديم شكوى إلينا أولًا بشأن خرق APPs، وإذا لم تُحل، إلى مكتب مفوض المعلومات الأسترالي (OAIC). تُعامل المعلومات الصحية كمعلومات حساسة وتحظى بحماية مشددة.</p></section><section><h2>16. سيادة بيانات الشعوب الأصلية</h2><p>يحترم PauseWell مبادئ سيادة بيانات الشعوب الأصلية. بالنسبة لأعضاء مجتمعات الشعوب الأصلية، بما في ذلك Cherokee وMuscogee وغيرها من Nations: بياناتك الصحية الشخصية ملك لك ولمجتمعك وليست لـ PauseWell؛ ندعم حقك في التحكم في كيفية جمع البيانات عنك واست
