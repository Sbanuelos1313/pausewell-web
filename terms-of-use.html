const DATA={"en":{"title":"PauseWell Terms of Use","h1":"PauseWell Terms of Use","tag":"","updated":"Last updated: January 1, 2026","intro":"These Terms of Use (“Terms”) govern your use of the PauseWell mobile application (“App”) operated by SamInterest LLC d/b/a Chronos AI (“Company”, “we”, “us”, or “our”). By downloading or using the App, you agree to be bound by these Terms.","body":"<section><h2>1. Acceptance of Terms</h2>\n<p>By accessing or using PauseWell, you confirm that you are at least 18 years of age and agree to these Terms and our Privacy Policy. If you do not agree, do not use the App.</p>\n</section>\n<section><h2>2. Description of Service</h2>\n<p>PauseWell is a wellness tracking application designed to help women in perimenopause, menopause, and post-menopause track symptoms, access educational content, and build personalized wellness practices. PauseWell is a wellness tool only and does not provide medical diagnoses, treatment recommendations, or clinical advice.</p>\n</section>\n<section><h2>3. Subscription Terms</h2>\n<p>PauseWell offers a free plan and an auto-renewable Pro subscription (“PauseWell Pro”) with a 7-day free trial for eligible new subscribers. The subscription price shown in the App Store or Google Play at the time of purchase is the price that applies to your subscription.</p>\n<h3><strong>Subscription details:</strong></h3>\n<div class='li'><strong>Title:</strong> PauseWell Pro Monthly</div>\n<div class='li'><strong>Length:</strong> 1 month (auto-renewable)</div>\n<div class='li'><strong>Price:</strong> As displayed in the App Store or Google Play at the time of purchase</div>\n<div class='li'><strong>Free trial:</strong> 7 days for eligible new subscribers</div>\n<p>Payment is charged to your Apple ID or Google Play account at confirmation of purchase. Subscriptions automatically renew unless cancelled at least 24 hours before the end of the current period. Manage or cancel your subscription in your App Store or Google Play account settings. Any unused portion of a free trial will be forfeited upon purchase of a subscription.</p>\n</section>\n<section><h2>4. Medical Disclaimer</h2>\n<p>PauseWell is not a medical device and does not provide medical advice. All content is for informational and wellness purposes only. Always consult a qualified healthcare provider before making any health decisions. Do not disregard professional medical advice based on information from this App.</p>\n</section>\n<section><h2>5. User Accounts</h2>\n<p>You are responsible for maintaining the confidentiality of your account credentials and for all activities under your account. Notify us immediately of any unauthorized use at <a href='mailto:support@chronosai.com'>support@chronosai.com</a>.</p>\n</section>\n<section><h2>6. Privacy</h2>\n<p>Your use of PauseWell is also governed by our Privacy Policy, which is incorporated into these Terms by reference.</p>\n</section>\n<section><h2>7. Intellectual Property</h2>\n<p>All content, features, and functionality of PauseWell are owned by SamInterest LLC and are protected by copyright, trademark, and other intellectual property laws.</p>\n</section>\n<section><h2>8. Prohibited Uses</h2>\n<p>You may not use the App to violate any laws, infringe any intellectual property rights, transmit harmful content, or attempt to gain unauthorized access to any systems.</p>\n</section>\n<section><h2>9. Disclaimer of Warranties</h2>\n<p>The App is provided “as is” without warranties of any kind, either express or implied. We do not warrant that the App will be uninterrupted, error-free, or free of viruses.</p>\n</section>\n<section><h2>10. Limitation of Liability</h2>\n<p>To the fullest extent permitted by law, SamInterest LLC shall not be liable for any indirect, incidental, special, or consequential damages arising from your use of the App.</p>\n</section>\n<section><h2>11. Changes to Terms</h2>\n<p>We may update these Terms at any time. Continued use of the App after changes constitutes acceptance of the new Terms.</p>\n</section>\n<section><h2>12. Governing Law</h2>\n<p>These Terms are governed by the laws of the State of Oklahoma, without regard to conflict of law provisions.</p>\n</section>\n<section><h2>13. Contact</h2>\n<p>For questions about these Terms, contact us at:</p>\n<p><a href='mailto:support@chronosai.com'>support@chronosai.com</a></p>\n</section>","notice":"English is the authoritative legal text."},"es":{"title":"Términos de uso de PauseWell","h1":"Términos de uso de PauseWell","tag":"","updated":"Última actualización: 1 de enero de 2026","intro":"Estos Términos de uso (“Términos”) rigen el uso de la aplicación móvil PauseWell (“Aplicación”), operada por SamInterest LLC d/b/a Chronos AI (“Compañía”, “nosotros” o “nuestro”). Al descargar o utilizar la Aplicación, aceptas estos Términos.","body":"<section><h2>1. Aceptación de los términos</h2><p>Al acceder o utilizar PauseWell, confirmas que tienes al menos 18 años y aceptas estos Términos y nuestra Política de privacidad. Si no estás de acuerdo, no utilices la Aplicación.</p></section><section><h2>2. Descripción del servicio</h2><p>PauseWell es una aplicación de seguimiento del bienestar diseñada para ayudar a mujeres en perimenopausia, menopausia y posmenopausia a registrar síntomas, acceder a contenido educativo y desarrollar prácticas de bienestar personalizadas. PauseWell es únicamente una herramienta de bienestar y no proporciona diagnósticos médicos, recomendaciones de tratamiento ni asesoramiento clínico.</p></section><section><h2>3. Términos de suscripción</h2><p>PauseWell ofrece un plan gratuito y una suscripción Pro autorrenovable (“PauseWell Pro”), con una prueba gratuita de 7 días para nuevos suscriptores elegibles. El precio mostrado en App Store o Google Play al momento de la compra es el precio que se aplica.</p><h3>Detalles de la suscripción:</h3><ul><li>Título: PauseWell Pro Mensual</li><li>Duración: 1 mes (autorrenovable)</li><li>Precio: según se muestre en App Store o Google Play al momento de la compra</li><li>Prueba gratuita: 7 días para nuevos suscriptores elegibles</li></ul><p>El pago se carga a tu Apple ID o cuenta de Google Play al confirmar la compra. La suscripción se renueva automáticamente salvo que se cancele al menos 24 horas antes del final del período actual. Puedes administrarla o cancelarla en la configuración de tu cuenta de App Store o Google Play. Cualquier parte no utilizada de una prueba gratuita se pierde al comprar una suscripción.</p></section><section><h2>4. Aviso médico</h2><p>PauseWell no es un dispositivo médico y no proporciona asesoramiento médico. Todo el contenido tiene únicamente fines informativos y de bienestar. Consulta siempre a un profesional sanitario cualificado antes de tomar decisiones sobre tu salud. No ignores el asesoramiento médico profesional basándote en información de esta Aplicación.</p></section><section><h2>5. Cuentas de usuario</h2><p>Eres responsable de mantener la confidencialidad de las credenciales de tu cuenta y de todas las actividades realizadas con ella. Notifícanos inmediatamente cualquier uso no autorizado en <a href='mailto:support@chronosai.com'>support@chronosai.com</a>.</p></section><section><h2>6. Privacidad</h2><p>El uso de PauseWell también se rige por nuestra Política de privacidad, incorporada a estos Términos por referencia.</p></section><section><h2>7. Propiedad intelectual</h2><p>Todo el contenido, las características y la funcionalidad de PauseWell pertenecen a SamInterest LLC y están protegidos por las leyes de derechos de autor, marcas y demás leyes de propiedad intelectual.</p></section><section><h2>8. Usos prohibidos</h2><p>No puedes utilizar la Aplicación para infringir leyes o derechos de propiedad intelectual, transmitir contenido dañino ni intentar obtener acceso no autorizado a ningún sistema.</p></section><section><h2>9. Exclusión de garantías</h2><p>La Aplicación se proporciona “tal cual”, sin garantías de ningún tipo, expresas o implícitas. No garantizamos que funcione sin interrupciones, esté libre de errores o de virus.</p></section><section><h2>10. Limitación de responsabilidad</h2><p>En la máxima medida permitida por la ley, SamInterest LLC no será responsable de daños indirectos, incidentales, especiales o consecuentes derivados del uso de la Aplicación.</p></section><section><h2>11. Cambios en los términos</h2><p>Podemos actualizar estos Términos en cualquier momento. El uso continuado de la Aplicación después de los cambios constituye la aceptación de los nuevos Términos.</p></section><section><h2>12. Ley aplicable</h2><p>Estos Términos se rigen por las leyes del Estado de Oklahoma, sin tener en cuenta sus disposiciones sobre conflicto de leyes.</p></section><section><h2>13. Contacto</h2><p>Si tienes preguntas sobre estos Términos, contáctanos en <a href='mailto:support@chronosai.com'>support@chronosai.com</a>.</p></section>","notice":"El texto legal en inglés es la versión autorizada."},"fr":{"title":"Conditions d’utilisation de PauseWell","h1":"Conditions d’utilisation de PauseWell","tag":"","updated":"Dernière mise à jour : 1er janvier 2026","intro":"Les présentes Conditions d’utilisation (« Conditions ») régissent votre utilisation de l’application mobile PauseWell (« Application »), exploitée par SamInterest LLC d/b/a Chronos AI (« Société », « nous » ou « notre »). En téléchargeant ou en utilisant l’Application, vous acceptez les présentes Conditions.","body":"<section><h2>1. Acceptation des conditions</h2><p>En accédant à PauseWell ou en l’utilisant, vous confirmez avoir au moins 18 ans et accepter les présentes Conditions ainsi que notre Politique de confidentialité. Si vous n’êtes pas d’accord, n’utilisez pas l’Application.</p></section><section><h2>2. Description du service</h2><p>PauseWell est une application de suivi du bien-être conçue pour aider les femmes en périménopause, ménopause et post-ménopause à suivre leurs symptômes, accéder à du contenu éducatif et développer des pratiques de bien-être personnalisées. PauseWell est uniquement un outil de bien-être et ne fournit aucun diagnostic médical, recommandation de traitement ni conseil clinique.</p></section><section><h2>3. Conditions d’abonnement</h2><p>PauseWell propose une formule gratuite et un abonnement Pro à renouvellement automatique (« PauseWell Pro »), avec un essai gratuit de 7 jours pour les nouveaux abonnés éligibles. Le prix affiché dans l’App Store ou Google Play au moment de l’achat est celui qui s’applique.</p><h3>Détails de l’abonnement :</h3><ul><li>Titre : PauseWell Pro mensuel</li><li>Durée : 1 mois (renouvellement automatique)</li><li>Prix : tel qu’affiché dans l’App Store ou Google Play au moment de l’achat</li><li>Essai gratuit : 7 jours pour les nouveaux abonnés éligibles</li></ul><p>Le paiement est débité de votre identifiant Apple ou compte Google Play lors de la confirmation de l’achat. L’abonnement est renouvelé automatiquement sauf annulation au moins 24 heures avant la fin de la période en cours. Vous pouvez le gérer ou l’annuler dans les réglages de votre compte App Store ou Google Play. Toute portion inutilisée d’un essai gratuit est perdue lors de l’achat d’un abonnement.</p></section><section><h2>4. Avertissement médical</h2><p>PauseWell n’est pas un dispositif médical et ne fournit pas de conseils médicaux. Tout le contenu est fourni uniquement à des fins d’information et de bien-être. Consultez toujours un professionnel de santé qualifié avant de prendre toute décision concernant votre santé. Ne négligez pas un avis médical professionnel sur la base d’informations provenant de cette Application.</p></section><section><h2>5. Comptes utilisateurs</h2><p>Vous êtes responsable de la confidentialité de vos identifiants et de toutes les activités effectuées sous votre compte. Informez-nous immédiatement de toute utilisation non autorisée à <a href='mailto:support@chronosai.com'>support@chronosai.com</a>.</p></section><section><h2>6. Confidentialité</h2><p>Votre utilisation de PauseWell est également régie par notre Politique de confidentialité, intégrée aux présentes Conditions par référence.</p></section><section><h2>7. Propriété intellectuelle</h2><p>L’ensemble du contenu, des caractéristiques et des fonctionnalités de PauseWell appartient à SamInterest LLC et est protégé par les lois relatives au droit d’auteur, aux marques et à la propriété intellectuelle.</p></section><section><h2>8. Utilisations interdites</h2><p>Vous ne pouvez pas utiliser l’Application pour enfreindre une loi ou un droit de propriété intellectuelle, transmettre du contenu nuisible ou tenter d’obtenir un accès non autorisé à un système.</p></section><section><h2>9. Exclusion de garanties</h2><p>L’Application est fournie « en l’état », sans garantie d’aucune sorte, expresse ou implicite. Nous ne garantissons pas qu’elle sera ininterrompue, exempte d’erreurs ou de virus.</p></section><section><h2>10. Limitation de responsabilité</h2><p>Dans toute la mesure permise par la loi, SamInterest LLC ne pourra être tenue responsable de dommages indirects, accessoires, spéciaux ou consécutifs découlant de votre utilisation de l’Application.</p></section><section><h2>11. Modification des conditions</h2><p>Nous pouvons mettre à jour les présentes Conditions à tout moment. La poursuite de l’utilisation de l’Application après les modifications vaut acceptation des nouvelles Conditions.</p></section><section><h2>12. Droit applicable</h2><p>Les présentes Conditions sont régies par les lois de l’État de l’Oklahoma, sans égard aux règles relatives aux conflits de lois.</p></section><section><h2>13. Contact</h2><p>Pour toute question concernant les présentes Conditions, contactez-nous à <a href='mailto:support@chronosai.com'>support@chronosai.com</a>.</p></section>","notice":"Le texte juridique anglais constitue la version de référence."},"pt":{"title":"Termos de Uso do PauseWell","h1":"Termos de Uso do PauseWell","tag":"","updated":"Última atualização: 1 de janeiro de 2026","intro":"Estes Termos de Uso (“Termos”) regem o uso do aplicativo móvel PauseWell (“Aplicativo”), operado pela SamInterest LLC d/b/a Chronos AI (“Empresa”, “nós” ou “nosso”). Ao baixar ou usar o Aplicativo, você concorda com estes Termos.","body":"<section><h2>1. Aceitação dos termos</h2><p>Ao acessar ou usar o PauseWell, você confirma que tem pelo menos 18 anos e concorda com estes Termos e com nossa Política de Privacidade. Se não concordar, não use o Aplicativo.</p></section><section><h2>2. Descrição do serviço</h2><p>PauseWell é um aplicativo de acompanhamento de bem-estar criado para ajudar mulheres na perimenopausa, menopausa e pós-menopausa a registrar sintomas, acessar conteúdo educativo e desenvolver práticas de bem-estar personalizadas. PauseWell é apenas uma ferramenta de bem-estar e não fornece diagnósticos médicos, recomendações de tratamento ou aconselhamento clínico.</p></section><section><h2>3. Termos da assinatura</h2><p>PauseWell oferece um plano gratuito e uma assinatura Pro com renovação automática (“PauseWell Pro”), com teste gratuito de 7 dias para novos assinantes elegíveis. O preço exibido na App Store ou no Google Play no momento da compra é o preço aplicável.</p><h3>Detalhes da assinatura:</h3><ul><li>Título: PauseWell Pro Mensal</li><li>Duração: 1 mês (renovação automática)</li><li>Preço: conforme exibido na App Store ou no Google Play no momento da compra</li><li>Teste gratuito: 7 dias para novos assinantes elegíveis</li></ul><p>O pagamento é cobrado do seu ID Apple ou da sua conta do Google Play na confirmação da compra. A assinatura é renovada automaticamente, a menos que seja cancelada pelo menos 24 horas antes do fim do período atual. Gerencie ou cancele sua assinatura nas configurações da App Store ou do Google Play. Qualquer parte não utilizada do teste gratuito será perdida ao adquirir uma assinatura.</p></section><section><h2>4. Aviso médico</h2><p>PauseWell não é um dispositivo médico e não fornece aconselhamento médico. Todo o conteúdo destina-se apenas a fins informativos e de bem-estar. Consulte sempre um profissional de saúde qualificado antes de tomar decisões sobre sua saúde. Não desconsidere orientação médica profissional com base em informações deste Aplicativo.</p></section><section><h2>5. Contas de usuário</h2><p>Você é responsável por manter a confidencialidade das credenciais da sua conta e por todas as atividades realizadas nela. Avise-nos imediatamente sobre qualquer uso não autorizado em <a href='mailto:support@chronosai.com'>support@chronosai.com</a>.</p></section><section><h2>6. Privacidade</h2><p>Seu uso do PauseWell também é regido por nossa Política de Privacidade, incorporada a estes Termos por referência.</p></section><section><h2>7. Propriedade intelectual</h2><p>Todo o conteúdo, os recursos e as funcionalidades do PauseWell pertencem à SamInterest LLC e são protegidos pelas leis de direitos autorais, marcas e demais leis de propriedade intelectual.</p></section><section><h2>8. Usos proibidos</h2><p>Você não pode usar o Aplicativo para violar leis ou direitos de propriedade intelectual, transmitir conteúdo prejudicial ou tentar obter acesso não autorizado a qualquer sistema.</p></section><section><h2>9. Isenção de garantias</h2><p>O Aplicativo é fornecido “no estado em que se encontra”, sem garantias de qualquer tipo, expressas ou implícitas. Não garantimos funcionamento sem interrupções, erros ou vírus.</p></section><section><h2>10. Limitação de responsabilidade</h2><p>Na máxima extensão permitida por lei, a SamInterest LLC não será responsável por danos indiretos, incidentais, especiais ou consequenciais decorrentes do uso do Aplicativo.</p></section><section><h2>11. Alterações nos termos</h2><p>Podemos atualizar estes Termos a qualquer momento. O uso contínuo do Aplicativo após alterações constitui aceitação dos novos Termos.</p></section><section><h2>12. Lei aplicável</h2><p>Estes Termos são regidos pelas leis do Estado de Oklahoma, sem considerar disposições sobre conflito de leis.</p></section><section><h2>13. Contato</h2><p>Para dúvidas sobre estes Termos, entre em contato conosco em <a href='mailto:support@chronosai.com'>support@chronosai.com</a>.</p></section>","notice":"O texto jurídico em inglês é a versão oficial."},"de":{"title":"Nutzungsbedingungen von PauseWell","h1":"Nutzungsbedingungen von PauseWell","tag":"","updated":"Zuletzt aktualisiert: 1. Januar 2026","intro":"Diese Nutzungsbedingungen („Bedingungen“) regeln deine Nutzung der mobilen PauseWell-App („App“), die von SamInterest LLC d/b/a Chronos AI („Unternehmen“, „wir“ oder „unser“) betrieben wird. Durch das Herunterladen oder die Nutzung der App stimmst du diesen Bedingungen zu.","body":"<section><h2>1. Annahme der Bedingungen</h2><p>Durch den Zugriff auf PauseWell oder dessen Nutzung bestätigst du, dass du mindestens 18 Jahre alt bist, und stimmst diesen Bedingungen sowie unserer Datenschutzerklärung zu. Wenn du nicht zustimmst, nutze die App nicht.</p></section><section><h2>2. Beschreibung des Dienstes</h2><p>PauseWell ist eine Wellness-Tracking-App, die Frauen in der Perimenopause, Menopause und Postmenopause dabei unterstützt, Symptome zu erfassen, Bildungsinhalte abzurufen und personalisierte Wellness-Praktiken aufzubauen. PauseWell ist ausschließlich ein Wellness-Tool und stellt keine medizinischen Diagnosen, Behandlungsempfehlungen oder klinische Beratung bereit.</p></section><section><h2>3. Abonnementbedingungen</h2><p>PauseWell bietet einen kostenlosen Tarif und ein automatisch verlängerbares Pro-Abonnement („PauseWell Pro“) mit einer 7-tägigen kostenlosen Testphase für berechtigte neue Abonnentinnen. Es gilt der Preis, der zum Zeitpunkt des Kaufs im App Store oder bei Google Play angezeigt wird.</p><h3>Abonnementdetails:</h3><ul><li>Titel: PauseWell Pro Monatlich</li><li>Laufzeit: 1 Monat (automatisch verlängerbar)</li><li>Preis: wie zum Zeitpunkt des Kaufs im App Store oder bei Google Play angezeigt</li><li>Kostenlose Testphase: 7 Tage für berechtigte neue Abonnentinnen</li></ul><p>Die Zahlung wird bei Bestätigung des Kaufs deinem Apple-ID- oder Google-Play-Konto belastet. Das Abonnement verlängert sich automatisch, sofern es nicht mindestens 24 Stunden vor Ende des aktuellen Zeitraums gekündigt wird. Du kannst es in den Einstellungen deines App-Store- oder Google-Play-Kontos verwalten oder kündigen. Ein nicht genutzter Teil der kostenlosen Testphase verfällt beim Kauf eines Abonnements.</p></section><section><h2>4. Medizinischer Hinweis</h2><p>PauseWell ist kein Medizinprodukt und bietet keine medizinische Beratung. Alle Inhalte dienen ausschließlich Informations- und Wellnesszwecken. Wende dich vor gesundheitlichen Entscheidungen immer an qualifiziertes medizinisches Fachpersonal. Ignoriere keinen professionellen medizinischen Rat aufgrund von Informationen aus dieser App.</p></section><section><h2>5. Benutzerkonten</h2><p>Du bist dafür verantwortlich, deine Zugangsdaten vertraulich zu behandeln und für alle Aktivitäten unter deinem Konto. Informiere uns unverzüglich über jede unbefugte Nutzung unter <a href='mailto:support@chronosai.com'>support@chronosai.com</a>.</p></section><section><h2>6. Datenschutz</h2><p>Deine Nutzung von PauseWell unterliegt außerdem unserer Datenschutzerklärung, die durch Verweis Bestandteil dieser Bedingungen ist.</p></section><section><h2>7. Geistiges Eigentum</h2><p>Alle Inhalte, Merkmale und Funktionen von PauseWell sind Eigentum von SamInterest LLC und durch Urheber-, Marken- und andere Gesetze zum Schutz geistigen Eigentums geschützt.</p></section><section><h2>8. Verbotene Nutzungen</h2><p>Du darfst die App nicht verwenden, um gegen Gesetze oder Rechte an geistigem Eigentum zu verstoßen, schädliche Inhalte zu übertragen oder unbefugten Zugriff auf Systeme zu erlangen.</p></section><section><h2>9. Gewährleistungsausschluss</h2><p>Die App wird „wie besehen“ ohne ausdrückliche oder stillschweigende Gewährleistungen jeglicher Art bereitgestellt. Wir gewährleisten nicht, dass sie unterbrechungsfrei, fehlerfrei oder frei von Viren ist.</p></section><section><h2>10. Haftungsbeschränkung</h2><p>Soweit gesetzlich zulässig, haftet SamInterest LLC nicht für indirekte, zufällige, besondere oder Folgeschäden, die aus deiner Nutzung der App entstehen.</p></section><section><h2>11. Änderungen der Bedingungen</h2><p>Wir können diese Bedingungen jederzeit aktualisieren. Die fortgesetzte Nutzung der App nach Änderungen gilt als Zustimmung zu den neuen Bedingungen.</p></section><section><h2>12. Anwendbares Recht</h2><p>Diese Bedingungen unterliegen den Gesetzen des Bundesstaates Oklahoma, ungeachtet kollisionsrechtlicher Bestimmungen.</p></section><section><h2>13. Kontakt</h2><p>Bei Fragen zu diesen Bedingungen kontaktiere uns unter <a href='mailto:support@chronosai.com'>support@chronosai.com</a>.</p></section>","notice":"Der englische Rechtstext ist die maßgebliche Fassung."},"ja":{"title":"PauseWell 利用規約","h1":"PauseWell 利用規約","tag":"","updated":"最終更新日：2026年1月1日","intro":"本利用規約（「本規約」）は、SamInterest LLC d/b/a Chronos AI（「当社」）が運営するPauseWellモバイルアプリケーション（「本アプリ」）の利用について定めるものです。本アプリをダウンロードまたは利用することにより、本規約に同意したものとみなされます。","body":"<section><h2>1. 規約への同意</h2><p>PauseWellにアクセスまたは利用することにより、18歳以上であることを確認し、本規約および当社のプライバシーポリシーに同意するものとします。同意しない場合は、本アプリを利用しないでください。</p></section><section><h2>2. サービスの説明</h2><p>PauseWellは、周閉経期、閉経期、閉経後の女性が症状を記録し、教育コンテンツにアクセスし、個人に合わせたウェルネス習慣を築くことを支援するウェルネス記録アプリです。PauseWellはウェルネスツールであり、医学的診断、治療の推奨、臨床的助言を提供するものではありません。</p></section><section><h2>3. サブスクリプション条件</h2><p>PauseWellは無料プランと、自動更新されるProサブスクリプション（「PauseWell Pro」）を提供しています。対象となる新規登録者には7日間の無料トライアルがあります。購入時にApp StoreまたはGoogle Playに表示される価格が適用されます。</p><h3>サブスクリプションの詳細：</h3><ul><li>名称：PauseWell Pro 月額</li><li>期間：1か月（自動更新）</li><li>価格：購入時にApp StoreまたはGoogle Playに表示される価格</li><li>無料トライアル：対象となる新規登録者は7日間</li></ul><p>購入確認時にApple IDまたはGoogle Playアカウントに課金されます。サブスクリプションは、現在の期間終了の少なくとも24時間前までに解約しない限り自動更新されます。App StoreまたはGoogle Playのアカウント設定で管理または解約できます。無料トライアルの未使用分は、サブスクリプション購入時に失効します。</p></section><section><h2>4. 医療に関する免責事項</h2><p>PauseWellは医療機器ではなく、医療上の助言を提供しません。すべてのコンテンツは情報提供およびウェルネス目的に限られます。健康に関する判断を行う前に、必ず資格を有する医療従事者に相談してください。本アプリの情報を理由に専門的な医療助言を無視しないでください。</p></section><section><h2>5. ユーザーアカウント</h2><p>アカウント認証情報の機密保持およびアカウント上のすべての活動について、利用者が責任を負います。不正使用があった場合は、<a href='mailto:support@chronosai.com'>support@chronosai.com</a>まで直ちにご連絡ください。</p></section><section><h2>6. プライバシー</h2><p>PauseWellの利用には、本規約に参照により組み込まれる当社のプライバシーポリシーも適用されます。</p></section><section><h2>7. 知的財産</h2><p>PauseWellのすべてのコンテンツ、機能および機能性はSamInterest LLCが所有し、著作権、商標その他の知的財産法により保護されています。</p></section><section><h2>8. 禁止される利用</h2><p>法令または知的財産権に違反する目的、有害なコンテンツを送信する目的、またはシステムへの不正アクセスを試みる目的で本アプリを利用してはなりません。</p></section><section><h2>9. 保証の否認</h2><p>本アプリは、明示または黙示を問わず、いかなる保証もなく「現状有姿」で提供されます。本アプリが中断なく、エラーなく、またはウイルスなく動作することを保証しません。</p></section><section><h2>10. 責任の制限</h2><p>法律で認められる最大限の範囲において、SamInterest LLCは、本アプリの利用から生じる間接的、付随的、特別または結果的損害について責任を負いません。</p></section><section><h2>11. 規約の変更</h2><p>当社は本規約をいつでも更新することがあります。変更後も本アプリを継続して利用した場合、新しい規約に同意したものとみなされます。</p></section><section><h2>12. 準拠法</h2><p>本規約は、法の抵触に関する規定を除き、オクラホマ州法に準拠します。</p></section><section><h2>13. お問い合わせ</h2><p>本規約に関するご質問は、<a href='mailto:support@chronosai.com'>support@chronosai.com</a>までお問い合わせください。</p></section>","notice":"英語の法的文書が正式な基準文書です。"},"ko":{"title":"PauseWell 이용 약관","h1":"PauseWell 이용 약관","tag":"","updated":"최종 업데이트: 2026년 1월 1일","intro":"본 이용 약관(“약관”)은 SamInterest LLC d/b/a Chronos AI(“회사” 또는 “당사”)가 운영하는 PauseWell 모바일 애플리케이션(“앱”)의 이용에 적용됩니다. 앱을 다운로드하거나 이용함으로써 본 약관에 동의하게 됩니다.","body":"<section><h2>1. 약관 동의</h2><p>PauseWell에 접속하거나 이용함으로써 귀하는 만 18세 이상임을 확인하고 본 약관 및 당사의 개인정보 처리방침에 동의합니다. 동의하지 않는 경우 앱을 이용하지 마십시오.</p></section><section><h2>2. 서비스 설명</h2><p>PauseWell은 폐경 전후기, 폐경기 및 폐경 후 여성들이 증상을 기록하고 교육 콘텐츠를 이용하며 개인화된 웰니스 습관을 형성하도록 돕는 웰니스 추적 앱입니다. PauseWell은 웰니스 도구일 뿐이며 의학적 진단, 치료 권고 또는 임상적 조언을 제공하지 않습니다.</p></section><section><h2>3. 구독 조건</h2><p>PauseWell은 무료 플랜과 자동 갱신되는 Pro 구독(“PauseWell Pro”)을 제공하며, 자격이 되는 신규 구독자에게 7일 무료 체
